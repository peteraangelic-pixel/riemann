name: Kaggriculture reactive recovery paired holdout
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-reactive-recovery-holdout.yml"]
permissions:
  contents: write
jobs:
  holdout:
    if: contains(github.event.head_commit.message, '[kg-reactive-recovery]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: {PYTHONPATH: kaggriculture_meta_lab}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install --disable-pip-version-check kaggle-environments==1.32.7 pytest
      - name: Unit tests and actual-framework paired holdout
        run: |
          python -m pytest -q kaggriculture_meta_lab/tests/test_reactive_recovery_wrapper.py
          rc=0
          python kaggriculture_meta_lab/scripts/validate_current.py \
            --candidate wrap:agents/current/agent_v9_b21_s16.py:agents/variants/reactive_recovery_wrapper.py \
            --control agents/current/agent_v9_b21_s16.py \
            --control agents/variants/agent_v11_subin_g4_29.py \
            --games 16 --workers 4 --start-seed 20261020 || rc=$?
          result=$(ls -t kaggriculture_meta_lab/results/validate-current-*.json | head -1)
          cp "$result" kaggriculture_meta_lab/results/reactive-recovery-vs-b21-g4-16seed-20260910.json
          exit "$rc"
      - name: Persist fail-closed evidence
        if: always()
        run: |
          test -f kaggriculture_meta_lab/results/reactive-recovery-vs-b21-g4-16seed-20260910.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/reactive-recovery-vs-b21-g4-16seed-20260910.json
          git commit -m "Record reactive recovery paired holdout"
          git push origin HEAD:arena/01a0712c-riemann
