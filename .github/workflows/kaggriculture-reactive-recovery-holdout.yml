name: Kaggriculture reactive recovery ablation
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths:
      - ".github/workflows/kaggriculture-reactive-recovery-holdout.yml"
      - "kaggriculture_meta_lab/scripts/screen_recovery_ablation.py"
permissions:
  contents: write
jobs:
  screen:
    if: contains(github.event.head_commit.message, '[kg-recovery-ablation]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: {PYTHONPATH: kaggriculture_meta_lab}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install --disable-pip-version-check kaggle-environments==1.32.7 pytest
      - name: Isolate recovery feature families
        run: |
          python -m pytest -q kaggriculture_meta_lab/tests/test_reactive_recovery_wrapper.py
          python kaggriculture_meta_lab/scripts/screen_recovery_ablation.py \
            --base kaggriculture_meta_lab/agents/variants/reactive_recovery_wrapper.py \
            --control agents/current/agent_v9_b21_s16.py \
            --games 4 --workers 4 --start-seed 20261100 \
            --output kaggriculture_meta_lab/results/reactive-recovery-ablation-20260910.json
      - name: Persist evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/reactive-recovery-ablation-20260910.json
          git commit -m "Record reactive recovery feature ablation"
          git push origin HEAD:arena/01a0712c-riemann
