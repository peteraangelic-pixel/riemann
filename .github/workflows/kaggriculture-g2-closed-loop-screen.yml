name: Kaggriculture G2 closed-loop local screen
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-g2-closed-loop-screen.yml"]
permissions:
  contents: write
jobs:
  screen:
    if: contains(github.event.head_commit.message, '[kg-g2-closed-screen]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: {PYTHONPATH: kaggriculture_meta_lab}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install --disable-pip-version-check kaggle-environments==1.32.7
      - name: Screen one-factor G2 policies in one worker pool
        run: |
          python kaggriculture_meta_lab/scripts/screen_g2_closed_loop.py \
            --base kaggriculture_meta_lab/agents/ref/agent_v10_subin_g2_83.py \
            --games 3 --workers 4 --start-seed 20261220 \
            --output kaggriculture_meta_lab/results/g2-closed-loop-one-factor-20260910.json
      - name: Persist screen
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/g2-closed-loop-one-factor-20260910.json
          git commit -m "Record G2 closed-loop one-factor screen"
          git push origin HEAD:arena/01a0712c-riemann
