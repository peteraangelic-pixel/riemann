name: Kaggriculture V17 state router check
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths:
      - ".github/workflows/kaggriculture-v17-state-router.yml"
      - "kaggriculture_meta_lab/scripts/validate_v17_targeted.py"
permissions: {contents: write}
jobs:
  check:
    if: contains(github.event.head_commit.message, '[kg-v17-router]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install --disable-pip-version-check py7zr kaggle-environments==1.32.7
      - run: |
          python - <<'PY'
          import json,pathlib,py7zr
          with py7zr.SevenZipFile('TOP12.7z') as z:z.extractall('/tmp/c')
          roots=[m.parent for m in pathlib.Path('/tmp/c').rglob('manifest.json') if len(json.loads(m.read_text()).get('teams',[]))==12]
          assert len(roots)==1;pathlib.Path('/tmp/root').write_text(str(roots[0]))
          PY
      - working-directory: kaggriculture_meta_lab/rust_port
        run: cargo build --release --locked
      - run: |
          python kaggriculture_meta_lab/scripts/validate_v17_targeted.py --corpus "$(cat /tmp/root)" --workers 4 --seed 195001 \
           --target-ranks 6,7,8,9 --negative-ranks 11,12 \
           --safe kaggriculture_meta_lab/agents/candidates/agent_v16_current_animal_crossover.py --router kaggriculture_meta_lab/agents/candidates/agent_v17_state_router.py \
           --output kaggriculture_meta_lab/results/v17-state-router-second-seed-20260912.json
      - run: |
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/v17-state-router-second-seed-20260912.json;git commit -m 'Record V17 second-seed state-router check'
          git pull --rebase origin arena/01a0712c-riemann;git push origin HEAD:arena/01a0712c-riemann
