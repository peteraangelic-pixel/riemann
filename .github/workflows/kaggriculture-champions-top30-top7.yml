name: Kaggriculture champions TOP30 and TOP7 audit
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-champions-top30-top7.yml"]
permissions:
  contents: write
jobs:
  audit:
    if: contains(github.event.head_commit.message, '[kg-champions-top30-top7]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install --disable-pip-version-check py7zr
      - name: Extract audited corpora and locate roots
        run: |
          python - <<'PY'
          import os, pathlib, py7zr
          for name in ('top30','top7'):
              with py7zr.SevenZipFile(name.upper()+'.7z') as archive:
                  archive.extractall('/tmp/'+name)
              manifests=list(pathlib.Path('/tmp/'+name).rglob('manifest.json'))
              if not manifests: raise SystemExit(name+' archive has no manifests')
              root=(manifests[0].parent if len(manifests)==1 else
                    pathlib.Path(os.path.commonpath([str(p.parent) for p in manifests])))
              pathlib.Path('/tmp/'+name+'-root').write_text(str(root))
              print(name,'corpus root:',root,'manifests:',len(manifests))
          PY
      - working-directory: kaggriculture_meta_lab/rust_port
        run: cargo build --release --locked
      - name: Original replay-seed TOP30 benchmarks
        run: |
          for spec in \
            'v16 kaggriculture_meta_lab/agents/variants/agent_v16_kanno_top7_champion.py' \
            'v3 kaggriculture_meta_lab/agents/candidates/top7_kanno_ep107381285_v3_sibling.py' \
            'v4 kaggriculture_meta_lab/agents/candidates/peer_v4_german9_kanno_v3.py' \
            'v5 kaggriculture_meta_lab/agents/candidates/peer_v5_evolved.py'; do
            set -- $spec
            python kaggriculture_meta_lab/scripts/benchmark_top30.py \
              --corpus "$(cat /tmp/top30-root)" --candidate "$2" --max-rank 30 --workers 4 \
              --output "kaggriculture_meta_lab/results/${1}-top30-original-seeds-20260910.json"
          done
      - name: Matched fresh-seed complete TOP7 benchmark
        run: |
          python kaggriculture_meta_lab/scripts/benchmark_champions_top15_fresh.py \
            --corpus "$(cat /tmp/top7-root)" --workers 4 --seeds 8 \
            --output kaggriculture_meta_lab/results/v16-v3-v4-v5-top7-fresh-20260910.json
      - name: Persist complete rows and summaries
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/*-top30-original-seeds-20260910.json \
            kaggriculture_meta_lab/results/v16-v3-v4-v5-top7-fresh-20260910.json
          git commit -m "Record champions TOP30 and TOP7 audit"
          git push origin HEAD:arena/01a0712c-riemann
