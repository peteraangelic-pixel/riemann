name: Kaggriculture V32 structural market search
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-v32-structural-market.yml"]
permissions: {contents: write}
jobs:
  search:
    if: contains(github.event.head_commit.message, '[kg-v32-market]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install --disable-pip-version-check --upgrade kaggle py7zr
      - env: {KAGGLE_API_TOKEN: "${{ secrets.KAGGLE_API_TOKEN }}"}
        run: |
          mkdir -p ~/.kaggle /tmp/live
          printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]' > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
          for sid in 56183278 56142365; do
            mkdir -p "/tmp/live/$sid"; kaggle competitions episodes "$sid" -v > "/tmp/e-$sid"
            grep -Eo '^[[:space:]]*[0-9]{6,}' "/tmp/e-$sid" | tr -d ' ' | head -12 > "/tmp/i-$sid"
            while read -r eid; do kaggle competitions replay "$eid" -p "/tmp/live/$sid"; done < "/tmp/i-$sid"
          done
      - run: |
          python - <<'PY'
          import json,pathlib,py7zr
          with py7zr.SevenZipFile('TOP50.7z') as z:z.extractall('/tmp/newtop')
          roots=[m.parent for m in pathlib.Path('/tmp/newtop').rglob('manifest.json') if len(json.loads(m.read_text(encoding='utf-8-sig')).get('teams',[]))==12]
          assert len(roots)==1,roots;pathlib.Path('/tmp/root').write_text(str(roots[0]))
          PY
      - working-directory: kaggriculture_meta_lab/rust_port
        run: cargo build --release --locked
      - run: |
          python kaggriculture_meta_lab/scripts/search_v32_structural_market.py --corpus "$(cat /tmp/root)" --live /tmp/live \
            --binary kaggriculture_meta_lab/rust_port/target/release/kg_sim --threads 4 --population 500 \
            --output kaggriculture_meta_lab/results/v32-structural-market-20261004.json
      - run: |
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/v32-structural-market-20261004.json
          git commit -m 'Record V32 structural market search'
          git pull --rebase origin arena/01a0712c-riemann
          git push origin HEAD:arena/01a0712c-riemann
