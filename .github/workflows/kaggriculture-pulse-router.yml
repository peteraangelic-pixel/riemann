name: Fertilizer pulse router foundation
on:
  push:
    branches: ["arena/01a087c0-riemann"]
    paths:
      - "kaggriculture_meta_lab/rust_port/src/overlay.rs"
      - ".github/workflows/kaggriculture-pulse-router.yml"
jobs:
  test:
    if: contains(github.event.head_commit.message, '[kg-router]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: kaggriculture_meta_lab/rust_port
        run: |
          cargo fmt --check
          cargo test --release --locked
          cargo clippy --release --locked -- -D warnings
