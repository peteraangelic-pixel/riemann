name: Kaggriculture V9 state router gate
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-v9-state-router-gate.yml"]
permissions:
  contents: write
jobs:
  gate:
    if: contains(github.event.head_commit.message, '[kg-v9-router]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install --disable-pip-version-check py7zr kaggle-environments
      - run: |
          python - <<'PY'
          import json,pathlib,py7zr
          for archive,label,n in [('TOP12.7z','top12',12),('TOP7.7z','top7',7)]:
           out='/tmp/'+label
           with py7zr.SevenZipFile(archive) as a:a.extractall(out)
           roots=[m.parent for m in pathlib.Path(out).rglob('manifest.json') if len(json.loads(m.read_text()).get('teams',[]))==n]
           assert len(roots)==1,(label,roots)
           pathlib.Path('/tmp/'+label+'-root').write_text(str(roots[0]))
          PY
      - working-directory: kaggriculture_meta_lab/rust_port
        run: cargo build --release --locked
      - name: Gate newest TOP12
        run: |
          python kaggriculture_meta_lab/scripts/benchmark_champions_top15_fresh.py --corpus "$(cat /tmp/top12-root)" --workers 4 --seeds 16 --seed-start 162000 \
            --candidate v7=kaggriculture_meta_lab/agents/candidates/agent_v7_market_probe.py \
            --candidate v8=kaggriculture_meta_lab/agents/candidates/agent_v8_market_tail.py \
            --candidate v9=kaggriculture_meta_lab/agents/candidates/agent_v9_market_adaptive.py \
            --output kaggriculture_meta_lab/results/v9-state-router-top12-20260910.json
      - name: Transfer gate previous TOP7
        run: |
          python kaggriculture_meta_lab/scripts/benchmark_champions_top15_fresh.py --corpus "$(cat /tmp/top7-root)" --workers 4 --seeds 16 --seed-start 162000 \
            --candidate v7=kaggriculture_meta_lab/agents/candidates/agent_v7_market_probe.py \
            --candidate v8=kaggriculture_meta_lab/agents/candidates/agent_v8_market_tail.py \
            --candidate v9=kaggriculture_meta_lab/agents/candidates/agent_v9_market_adaptive.py \
            --output kaggriculture_meta_lab/results/v9-state-router-previous-top7-20260910.json
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/v9-state-router-*.json
          git commit -m "Record V9 state router gates"
          git push origin HEAD:arena/01a0712c-riemann
