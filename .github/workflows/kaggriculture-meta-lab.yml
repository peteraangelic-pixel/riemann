name: Kaggriculture Meta-Lab

on:
  push:
    branches: ["arena/**"]
    paths:
      - "kaggriculture_meta_lab/**"
      - ".github/workflows/kaggriculture-meta-lab.yml"
  pull_request:
    paths:
      - "kaggriculture_meta_lab/**"
  workflow_dispatch:
    inputs:
      closed_loop_smoke:
        description: "Run a small closed-loop tournament smoke (slow)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests + compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: kaggriculture_meta_lab
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Compile all sources
        working-directory: kaggriculture_meta_lab
        run: python -m py_compile scripts/*.py kaggriculture_lab/*.py agents/variants/*.py
      - name: Unit tests
        working-directory: kaggriculture_meta_lab
        run: python -m pytest -q

  closed-loop-smoke:
    name: Closed-loop tournament smoke
    if: (github.event_name == 'workflow_dispatch' && inputs.closed_loop_smoke)
          || (github.event_name == 'push' && contains(github.event.head_commit.message, '[meta-smoke]'))
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: kaggriculture_meta_lab
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Small closed-loop tournament (starter vs pass, full games)
        working-directory: kaggriculture_meta_lab
        run: |
          python scripts/run_tournament.py \
            --candidate starter \
            --opponent pass=pass \
            --games 8 --workers 4
      - name: Open-loop corpus smoke (bundled sample)
        working-directory: kaggriculture_meta_lab
        run: |
          python scripts/run_corpus.py \
            --candidate starter --corpus corpus/sample \
            --team "nonexistent_team_marker" --workers 4 --limit 2
