name: Kaggriculture v11 scored reactive screen and G4 status
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-v11-reactive-screen.yml"]
permissions:
  contents: write
jobs:
  screen:
    if: contains(github.event.head_commit.message, '[kg-v11-reactive-screen]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install --disable-pip-version-check kaggle-environments==1.32.7 kaggle pytest
      - name: Unit tests and bounded generator smoke
        run: |
          python -m pytest -q kaggriculture_meta_lab/tests/test_reactive_action_scoring.py kaggriculture_meta_lab/tests/test_reactive_genetics.py
          python kaggriculture_meta_lab/scripts/generate_reactive_population.py \
            --base kaggriculture_meta_lab/agents/variants/agent_v11_reactive_score.py \
            --output /tmp/v11-pop --population 16 --seed 20260910
      - name: Both-seat fail-closed screen
        env: {PYTHONPATH: kaggriculture_meta_lab}
        run: |
          rc=0
          python kaggriculture_meta_lab/scripts/validate_current.py \
            --candidate agents/variants/agent_v11_reactive_score.py \
            --control agents/variants/agent_v10_reactive_subin.py \
            --control agents/ref/agent_v7.py \
            --control agents/current/agent_v9_b21_s16.py \
            --games 4 --workers 4 --start-seed 20260980 || rc=$?
          result=$(ls -t kaggriculture_meta_lab/results/validate-current-*.json | head -1)
          cp "$result" kaggriculture_meta_lab/results/v11-reactive-score-screen-20260910.json
          exit "$rc"
      - name: Query explicitly requested G4 submission
        if: always()
        env: {KAGGLE_API_TOKEN: "${{ secrets.KAGGLE_API_TOKEN }}"}
        run: |
          mkdir -p ~/.kaggle
          printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]' > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
          kaggle competitions submissions -c kaggriculture --csv > kaggriculture_meta_lab/results/kaggle-g4-29-status-20260910.csv
          grep 'V11 G4-29' kaggriculture_meta_lab/results/kaggle-g4-29-status-20260910.csv | head -1
      - name: Persist records
        if: always()
        run: |
          test -f kaggriculture_meta_lab/results/v11-reactive-score-screen-20260910.json
          test -s kaggriculture_meta_lab/results/kaggle-g4-29-status-20260910.csv
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/v11-reactive-score-screen-20260910.json kaggriculture_meta_lab/results/kaggle-g4-29-status-20260910.csv
          git commit -m "Record v11 reactive screen and G4 status"
          git push origin HEAD:arena/01a0712c-riemann
