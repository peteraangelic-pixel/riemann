name: Kaggriculture V7 peer discovery audit
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-v7-peer-audit.yml"]
permissions:
  contents: write
jobs:
  audit:
    if: contains(github.event.head_commit.message, '[kg-v7-peer-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install --disable-pip-version-check py7zr
      - name: Extract TOP15
        run: |
          python - <<'PY'
          import os,pathlib,py7zr
          with py7zr.SevenZipFile('TOP15.7z') as a:a.extractall('/tmp/top15')
          ms=list(pathlib.Path('/tmp/top15').rglob('manifest.json'))
          root=ms[0].parent if len(ms)==1 else pathlib.Path(os.path.commonpath([str(x.parent) for x in ms]))
          pathlib.Path('/tmp/top15-root').write_text(str(root))
          PY
      - working-directory: kaggriculture_meta_lab/rust_port
        run: cargo build --release --locked
      - name: Full matched audit of peer discovery
        run: |
          python kaggriculture_meta_lab/scripts/benchmark_champions_top15_fresh.py \
            --corpus "$(cat /tmp/top15-root)" --workers 4 --seeds 8 \
            --candidate v16=kaggriculture_meta_lab/agents/variants/agent_v16_kanno_top7_champion.py \
            --candidate v3=kaggriculture_meta_lab/agents/candidates/agent_v3_coherent_replay.py \
            --candidate v6=kaggriculture_meta_lab/agents/candidates/agent_v6_safe_opening.py \
            --candidate v7=kaggriculture_meta_lab/agents/candidates/agent_v7_market_probe.py \
            --candidate g2=kaggriculture_meta_lab/agents/variants/agent_v10_subin_106845775.py \
            --output kaggriculture_meta_lab/results/v7-peer-audit-top15-fresh-20260910.json
      - name: Persist complete result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/v7-peer-audit-top15-fresh-20260910.json
          git commit -m "Record V7 peer discovery TOP15 audit"
          git push origin HEAD:arena/01a0712c-riemann
