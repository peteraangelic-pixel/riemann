name: All-turn single market mutation scan
on:
  push:
    branches: ["arena/01a087c0-riemann"]
    paths: [".github/workflows/kaggriculture-single-market-scan.yml", "kaggriculture_meta_lab/seat_087c0/scripts/search_single_market_mutations.py"]
permissions:
  contents: write
jobs:
  scan:
    if: contains(github.event.head_commit.message, '[kg-market-scan]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install --disable-pip-version-check py7zr
      - name: Retrieve both broad corpora
        run: |
          git fetch origin arena/01a0712c-riemann
          for n in TOP7 TOP15; do git show FETCH_HEAD:$n.7z >/tmp/$n.7z; done
          python - <<'PY'
          import json,pathlib,py7zr
          for n in ('TOP7','TOP15'):
           dst=pathlib.Path('/tmp')/n.lower()
           with py7zr.SevenZipFile('/tmp/'+n+'.7z') as a:a.extractall(dst)
           roots=[m for m in dst.rglob('manifest.json') if 'teams' in json.loads(m.read_text())]
           pathlib.Path('/tmp/'+n.lower()+'-root').write_text(str(roots[0].parent))
          PY
      - working-directory: kaggriculture_meta_lab/rust_port
        run: cargo build --release --locked
      - name: Scan every differing V2 market turn and hold out finalists
        run: |
          python kaggriculture_meta_lab/seat_087c0/scripts/search_single_market_mutations.py \
            --top7 "$(cat /tmp/top7-root)" --top15 "$(cat /tmp/top15-root)" \
            --binary kaggriculture_meta_lab/rust_port/target/release/kg_sim \
            --v7 kaggriculture_meta_lab/seat_087c0/candidates/audit-v7.py \
            --v2 kaggriculture_meta_lab/seat_087c0/candidates/audit-v2.py --threads 4 \
            --output kaggriculture_meta_lab/seat_087c0/results/single-market-mutation-scan.json
      - name: Persist result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/seat_087c0/results/single-market-mutation-scan.json
          git commit -m "Record all-turn single market mutation scan"
          git push origin HEAD:arena/01a087c0-riemann
