name: Kaggriculture peer V5 independent validation
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-peer-v5-independent.yml"]
permissions:
  contents: write
jobs:
  validate:
    if: contains(github.event.head_commit.message, '[kg-peer-v5-independent]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: kaggriculture_meta_lab/rust_port
        run: cargo build --release --locked
      - run: |
          python kaggriculture_meta_lab/scripts/validate_peer_v5_independent.py \
            --binary kaggriculture_meta_lab/rust_port/target/release/kg_sim \
            --output kaggriculture_meta_lab/results/peer-v5-independent-20260910.json --threads 4
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/peer-v5-independent-20260910.json
          git commit -m "Record peer V5 independent validation"
          git push origin HEAD:arena/01a0712c-riemann
