name: Kaggriculture checks

on:
  push:
    branches: ["arena/**"]
    paths:
      - "kaggriculture/**"
      - ".github/workflows/kaggriculture.yml"
  workflow_dispatch:
    inputs:
      submit:
        description: "Build submission.tar.gz and upload to Kaggle (requires KAGGLE_* secrets)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  offline:
    name: Offline agent tests and local matches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install engine
        working-directory: kaggriculture
        run: pip install kaggle-environments
      - name: Compile tracked sources
        working-directory: kaggriculture
        run: python -m py_compile agent.py simulate.py tests/test_agent.py
      - name: Run offline tests
        working-directory: kaggriculture
        run: python -m unittest discover -s tests -v
      - name: Smoke local match (pass + random + starter, 720 turns)
        working-directory: kaggriculture
        run: |
          python simulate.py --games 1 --opponent pass --steps 720 --seed 11
          python simulate.py --games 1 --opponent random --steps 720 --seed 11
          python simulate.py --games 1 --opponent starter --steps 720 --seed 11
      - name: Build submission artifact
        working-directory: kaggriculture
        run: |
          python - <<'PY'
          import shutil, tarfile
          shutil.copy('agent.py', 'main.py')
          with tarfile.open('submission.tar.gz', 'w:gz') as t:
              t.add('main.py')
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: kaggriculture-submission-${{ github.run_id }}
          path: kaggriculture/submission.tar.gz
          retention-days: 7

  submit:
    name: Upload to Kaggle
    if: (github.event_name == 'workflow_dispatch' && inputs.submit) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[kaggr-submit]'))
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Configure Kaggle credentials
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p ~/.kaggle
          if [ -n "$KAGGLE_API_TOKEN" ]; then
            # Strip CR/LF or surrounding whitespace accidentally copied into
            # the GitHub secret; raw whitespace is an invalid HTTP header.
            clean_token=$(printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]')
            if [ -z "$clean_token" ]; then
              echo "::error::KAGGLE_API_TOKEN is empty after whitespace removal"
              exit 1
            fi
            printf '%s' "$clean_token" > ~/.kaggle/access_token
            chmod 600 ~/.kaggle/access_token
          elif [ -n "$KAGGLE_USERNAME" ] && [ -n "$KAGGLE_KEY" ]; then
            # Backward-compatible legacy API credentials.
            printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
            chmod 600 ~/.kaggle/kaggle.json
          else
            echo "::error::KAGGLE_API_TOKEN (or KAGGLE_USERNAME/KAGGLE_KEY) secrets missing"
            exit 1
          fi
      - name: Install Kaggle CLI
        run: pip install kaggle
      - name: Pack agent
        working-directory: kaggriculture
        run: |
          cp agent.py main.py
          tar -czf submission.tar.gz main.py
      - name: Submit
        working-directory: kaggriculture
        run: |
          set +e
          output=$(kaggle competitions submit -c kaggriculture -f submission.tar.gz -m "kaggr ci $GITHUB_SHA" 2>&1)
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            # Surface a bounded, token-redacted diagnostic through the Checks
            # API even when the external Actions log store is unavailable.
            safe_output=$(printf '%s' "$output" | sed -E 's/KGAT_[A-Za-z0-9_-]+/[REDACTED]/g' | tail -c 3000)
            safe_output=${safe_output//'%'/'%25'}
            safe_output=${safe_output//$'\n'/'%0A'}
            safe_output=${safe_output//$'\r'/'%0D'}
            echo "::error title=Kaggle submission failed::$safe_output"
            exit "$status"
          fi
          printf '%s\n' "$output"
          kaggle competitions submissions kaggriculture

  monitor:
    name: Read Kaggle status
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[kaggr-status]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Configure Kaggle token
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p ~/.kaggle
          clean_token=$(printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]')
          if [ -z "$clean_token" ]; then
            echo "::error::KAGGLE_API_TOKEN is missing"
            exit 1
          fi
          printf '%s' "$clean_token" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
      - name: Install Kaggle CLI
        run: pip install kaggle
      - name: Publish status as check annotations
        run: |
          submissions=$(kaggle competitions submissions kaggriculture 2>&1)
          set +e
          leaderboard=$(kaggle competitions leaderboard kaggriculture -s 2>&1)
          leaderboard_status=$?
          set -e

          report=$(printf 'SUBMISSIONS\n%s\n\nLEADERBOARD (exit %s)\n%s' \
            "$(printf '%s' "$submissions" | head -20)" \
            "$leaderboard_status" \
            "$(printf '%s' "$leaderboard" | head -25)")
          safe_report=$(printf '%s' "$report" | sed -E 's/KGAT_[A-Za-z0-9_-]+/[REDACTED]/g' | tail -c 6000)
          safe_report=${safe_report//'%'/'%25'}
          safe_report=${safe_report//$'\n'/'%0A'}
          safe_report=${safe_report//$'\r'/'%0D'}
          echo "::notice title=Kaggriculture online status::$safe_report"
