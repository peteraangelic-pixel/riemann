          - {id: melon7, args: "--set MELON_CELLS=[[0,0],[1,0],[2,0],[3,0],[0,1],[1,1],[2,1]]"}
          # Small two-change groups test only interpretable interactions.
          - {id: value-late1, args: "--set HAND_TASK_MODE=VALUE_FIRST --set LATE_CROP_HAND_BONUS=1"}
          - {id: harvest-late1, args: "--set HAND_TASK_MODE=HARVEST_FIRST --set LATE_CROP_HAND_BONUS=1"}
          - {id: cow8-value, args: "--set ADAPT_COW_THRESHOLD=8 --set HAND_TASK_MODE=VALUE_FIRST"}
    steps:
