  v6-replay-stage-a:
    name: V6 replay A ${{ matrix.id }}
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[kaggr-v6-replay-a]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {id: control, args: ""}
          # Assignment efficiency: one routing policy at a time.
          - {id: hand-harvest, args: "--set HAND_TASK_MODE=HARVEST_FIRST"}
          - {id: hand-plant, args: "--set HAND_TASK_MODE=PLANT_FIRST"}
          - {id: hand-value, args: "--set HAND_TASK_MODE=VALUE_FIRST"}
          # The strongest opponents use 12-14 hands; isolate late staffing.
          - {id: late-hand1, args: "--set LATE_CROP_HAND_BONUS=1"}
          - {id: late-hand2, args: "--set LATE_CROP_HAND_BONUS=2 --set HANDS_MAX=14"}
          - {id: sparse-hands11, args: "--set CELLS_PER_HAND=11"}
          - {id: sparse-hands12, args: "--set CELLS_PER_HAND=12"}
