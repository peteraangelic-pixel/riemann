name: Kaggriculture checks

on:
  push:
    branches: ["arena/**"]
    paths:
      - "kaggriculture/**"
      - ".github/workflows/kaggriculture.yml"
  workflow_dispatch:
    inputs:
      submit:
        description: "Build submission.tar.gz and upload to Kaggle (requires KAGGLE_* secrets)"
        required: false
        default: false
        type: boolean

permissions:
  # Read by default; the explicitly gated collector uses this to persist
  # compressed public-match telemetry on the current competition branch.
  contents: write

jobs:
  offline:
    name: Offline agent tests and local matches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install engine
        working-directory: kaggriculture
        run: pip install kaggle-environments
      - name: Compile tracked sources
        working-directory: kaggriculture
        run: python -m py_compile agent.py agent_v5.py simulate.py tune_animals.py analyze_online.py replay_benchmark.py tests/test_agent.py
      - name: Run offline tests
        working-directory: kaggriculture
        run: python -m unittest discover -s tests -v
      - name: Smoke local match (pass + random + starter, 720 turns)
        working-directory: kaggriculture
        run: |
          python simulate.py --games 1 --opponent pass --steps 720 --seed 11
          python simulate.py --games 1 --opponent random --steps 720 --seed 11
          python simulate.py --games 1 --opponent starter --steps 720 --seed 11
      - name: Build submission artifact
        working-directory: kaggriculture
        run: |
          python - <<'PY'
          import shutil, tarfile
          shutil.copy('agent_v5.py', 'main.py')
          with tarfile.open('submission.tar.gz', 'w:gz') as t:
              t.add('main.py')
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: kaggriculture-submission-${{ github.run_id }}
          path: kaggriculture/submission.tar.gz
          retention-days: 7

  submit:
    name: Upload to Kaggle
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.submit) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[kaggr-submit]'))
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Configure Kaggle credentials
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p ~/.kaggle
          if [ -n "$KAGGLE_API_TOKEN" ]; then
            # Strip CR/LF or surrounding whitespace accidentally copied into
            # the GitHub secret; raw whitespace is an invalid HTTP header.
            clean_token=$(printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]')
            if [ -z "$clean_token" ]; then
              echo "::error::KAGGLE_API_TOKEN is empty after whitespace removal"
              exit 1
            fi
            printf '%s' "$clean_token" > ~/.kaggle/access_token
            chmod 600 ~/.kaggle/access_token
          elif [ -n "$KAGGLE_USERNAME" ] && [ -n "$KAGGLE_KEY" ]; then
            # Backward-compatible legacy API credentials.
            printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
            chmod 600 ~/.kaggle/kaggle.json
          else
            echo "::error::KAGGLE_API_TOKEN (or KAGGLE_USERNAME/KAGGLE_KEY) secrets missing"
            exit 1
          fi
      - name: Install Kaggle CLI
        run: pip install kaggle
      - name: Pack selected 94k finalist
        working-directory: kaggriculture
        run: |
          cp agent_v5.py main.py
          tar -czf submission.tar.gz main.py
      - name: Submit
        working-directory: kaggriculture
        run: |
          set +e
          output=$(kaggle competitions submit -c kaggriculture -f submission.tar.gz -m "kaggr ci $GITHUB_SHA" 2>&1)
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            # Surface a bounded, token-redacted diagnostic through the Checks
            # API even when the external Actions log store is unavailable.
            safe_output=$(printf '%s' "$output" | sed -E 's/KGAT_[A-Za-z0-9_-]+/[REDACTED]/g' | tail -c 3000)
            safe_output=${safe_output//'%'/'%25'}
            safe_output=${safe_output//$'\n'/'%0A'}
            safe_output=${safe_output//$'\r'/'%0D'}
            echo "::error title=Kaggle submission failed::$safe_output"
            exit "$status"
          fi
          printf '%s\n' "$output"
          kaggle competitions submissions kaggriculture

  monitor:
    name: Read Kaggle status
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[kaggr-status]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Configure Kaggle token
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p ~/.kaggle
          clean_token=$(printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]')
          if [ -z "$clean_token" ]; then
            echo "::error::KAGGLE_API_TOKEN is missing"
            exit 1
          fi
          printf '%s' "$clean_token" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
      - name: Install Kaggle CLI
        run: pip install kaggle
      - name: Publish status as check annotations
        run: |
          submissions=$(kaggle competitions submissions kaggriculture 2>&1)
          set +e
          leaderboard=$(kaggle competitions leaderboard kaggriculture -s 2>&1)
          leaderboard_status=$?
          set -e

          submission_refs=$(printf '%s\n' "$submissions" | awk '$1 ~ /^[0-9]+$/ {print $1}')
          episodes_report=''
          if [ -n "$submission_refs" ]; then
            for submission_ref in $submission_refs; do
              set +e
              episodes=$(kaggle competitions episodes "$submission_ref" 2>&1)
              episodes_status=$?
              set -e
              episodes_report=$(printf '%s\n\nSUBMISSION %s (exit %s)\n%s' \
                "$episodes_report" "$submission_ref" "$episodes_status" \
                "$(printf '%s' "$episodes" | head -40)")
            done
          else
            episodes_report='Could not parse any submission refs.'
          fi

          report=$(printf 'SUBMISSIONS\n%s\n\nEPISODES%s\n\nLEADERBOARD (exit %s)\n%s' \
            "$(printf '%s' "$submissions" | head -20)" \
            "$episodes_report" \
            "$leaderboard_status" \
            "$(printf '%s' "$leaderboard" | head -25)")
          safe_report=$(printf '%s' "$report" | sed -E 's/KGAT_[A-Za-z0-9_-]+/[REDACTED]/g' | tail -c 30000)
          safe_report=${safe_report//'%'/'%25'}
          safe_report=${safe_report//$'\n'/'%0A'}
          safe_report=${safe_report//$'\r'/'%0D'}
          echo "::notice title=Kaggriculture online status::$safe_report"

  collect:
    name: Collect all missing public replays
    if: >-
      github.event_name == 'push' &&
      github.ref_name == 'arena/01a0712c-riemann' &&
      contains(github.event.head_commit.message, '[kaggr-collect]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Configure Kaggle token
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p ~/.kaggle
          clean_token=$(printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]')
          if [ -z "$clean_token" ]; then
            echo "::error::KAGGLE_API_TOKEN is missing"
            exit 1
          fi
          printf '%s' "$clean_token" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
      - name: Install Kaggle CLI
        run: pip install kaggle
      - name: Download every missing public episode
        id: episodes
        run: |
          submissions=$(kaggle competitions submissions kaggriculture)
          submission_refs=$(printf '%s\n' "$submissions" | awk '$1 ~ /^[0-9]+$/ {print $1}')
          if [ -z "$submission_refs" ]; then
            echo "::error::No submission refs found"
            exit 1
          fi

          collected=''
          found_public=0
          for submission_ref in $submission_refs; do
            episode_table=$(kaggle competitions episodes "$submission_ref")
            episode_ids=$(printf '%s\n' "$episode_table" | awk '$1 ~ /^[0-9]+$/ && /PUBLIC/ {print $1}')
            for episode_id in $episode_ids; do
              found_public=1
              target_dir="kaggriculture/online/$episode_id"
              if [ -s "$target_dir/replay.json.gz" ]; then
                echo "Episode $episode_id from submission $submission_ref is already present."
                continue
              fi

              temp_dir=$(mktemp -d)
              mkdir -p "$target_dir"
              kaggle competitions replay "$episode_id" -p "$temp_dir/replay"
              replay_file=$(find "$temp_dir/replay" -type f -name '*.json' | head -1)
              if [ -z "$replay_file" ]; then
                echo "::error::Replay command produced no JSON for episode $episode_id"
                exit 1
              fi
              gzip -9c "$replay_file" > "$target_dir/replay.json.gz"

              for agent_index in 0 1; do
                mkdir -p "$temp_dir/log-$agent_index"
                kaggle competitions logs "$episode_id" "$agent_index" -p "$temp_dir/log-$agent_index" || true
                log_file=$(find "$temp_dir/log-$agent_index" -type f -name '*.json' | head -1)
                if [ -n "$log_file" ]; then
                  cp "$log_file" "$target_dir/agent-$agent_index-log.json"
                fi
              done
              printf 'submission_ref=%s\nepisode_id=%s\n' "$submission_ref" "$episode_id" > "$target_dir/metadata.txt"
              collected="${collected:+$collected,}$episode_id"
              rm -rf "$temp_dir"
            done
          done
          if [ "$found_public" -eq 0 ]; then
            echo "::error::No completed public episodes found for any submission"
            exit 1
          fi
          echo "collected_ids=${collected:-none}" >> "$GITHUB_OUTPUT"
      - name: Commit telemetry
        run: |
          if git diff --quiet -- kaggriculture/online && [ -z "$(git ls-files --others --exclude-standard kaggriculture/online)" ]; then
            echo "All public episodes are already collected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kaggriculture/online
          git commit -m "data(kaggriculture): collect episodes ${{ steps.episodes.outputs.collected_ids }} [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"

  tune:
    name: Animal sweep g${{ matrix.geese }}-w${{ matrix.per_worker }}-f${{ matrix.feed_days }}
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[kaggr-tune]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {geese: 4, per_worker: 2, feed_days: 3}
          - {geese: 5, per_worker: 2, feed_days: 2}
          - {geese: 5, per_worker: 2, feed_days: 3}
          - {geese: 5, per_worker: 2, feed_days: 4}
          - {geese: 5, per_worker: 3, feed_days: 3}
          - {geese: 6, per_worker: 2, feed_days: 3}
          - {geese: 6, per_worker: 3, feed_days: 3}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install kaggle-environments
      - name: Run matched-seed comparison
        working-directory: kaggriculture
        run: |
          output=$(python tune_animals.py \
            --geese ${{ matrix.geese }} \
            --per-worker ${{ matrix.per_worker }} \
            --feed-days ${{ matrix.feed_days }} \
            --seeds 12)
          echo "$output"
          echo "::notice title=Animal sweep result::$output"

  replay-benchmark:
    name: Real replay benchmark shard ${{ matrix.shard }}
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[kaggr-replay-bench]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install kaggle-environments
      - name: Replay real opponents
        working-directory: kaggriculture
        run: |
          output=$(python replay_benchmark.py --shard ${{ matrix.shard }} --shards 4)
          echo "$output"
          summary=$(printf '%s\n' "$output" | tail -1)
          echo "::notice title=Replay benchmark result::$summary"

  v6-routing-sweep:
    name: V6 routing ${{ matrix.id }}
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[kaggr-v6-routing]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {id: timed-0-0, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=0 --set LAND_SW_BUY_DAY=0"}
          - {id: timed-4-6, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=4 --set LAND_SW_BUY_DAY=6"}
          - {id: timed-6-8, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=6 --set LAND_SW_BUY_DAY=8"}
          - {id: timed-7-8, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=7 --set LAND_SW_BUY_DAY=8"}
          - {id: timed-8-9, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=8 --set LAND_SW_BUY_DAY=9"}
          - {id: timed-8-10, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=8 --set LAND_SW_BUY_DAY=10"}
          - {id: timed-7-8-r500, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=7 --set LAND_SW_BUY_DAY=8 --set LAND_RESERVE=500"}
          - {id: global, args: "--set GLOBAL_CROP_TASKS=true"}
          - {id: global-industrial, args: "--set GLOBAL_CROP_TASKS=true --set LABOR_MODE=INDUSTRIAL --set HANDS_MAX=14"}
          - {id: global-dmitri, args: "--set GLOBAL_CROP_TASKS=true --set LABOR_MODE=DMITRI"}
          - {id: timed-dmitri, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=7 --set LAND_SW_BUY_DAY=8 --set LABOR_MODE=DMITRI"}
          - {id: timed-industrial, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=7 --set LAND_SW_BUY_DAY=8 --set LABOR_MODE=INDUSTRIAL --set HANDS_MAX=14"}
          - {id: timed-straw4, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=7 --set LAND_SW_BUY_DAY=8 --set STRAWBERRY_TARGET=4 --set STRAWBERRY_START_DAY=8 --set PREMIUM_SEED_BATCH=4"}
          - {id: timed-straw8, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=7 --set LAND_SW_BUY_DAY=8 --set STRAWBERRY_TARGET=8 --set STRAWBERRY_START_DAY=8 --set PREMIUM_SEED_BATCH=4"}
          - {id: timed-straw16, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=7 --set LAND_SW_BUY_DAY=8 --set STRAWBERRY_TARGET=16 --set STRAWBERRY_START_DAY=8 --set PREMIUM_SEED_BATCH=6"}
          - {id: timed-straw28, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=7 --set LAND_SW_BUY_DAY=8 --set STRAWBERRY_TARGET=28 --set STRAWBERRY_START_DAY=8 --set PREMIUM_SEED_BATCH=8"}
          - {id: timed-straw8-prep1, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=7 --set LAND_SW_BUY_DAY=8 --set STRAWBERRY_TARGET=8 --set STRAWBERRY_START_DAY=8 --set STRAWBERRY_PREP_DAYS=1 --set PREMIUM_SEED_BATCH=4"}
          - {id: timed-straw16-prep1, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=7 --set LAND_SW_BUY_DAY=8 --set STRAWBERRY_TARGET=16 --set STRAWBERRY_START_DAY=8 --set STRAWBERRY_PREP_DAYS=1 --set PREMIUM_SEED_BATCH=6"}
          - {id: timed-straw16-prep2, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=7 --set LAND_SW_BUY_DAY=8 --set STRAWBERRY_TARGET=16 --set STRAWBERRY_START_DAY=8 --set STRAWBERRY_PREP_DAYS=2 --set PREMIUM_SEED_BATCH=6"}
          - {id: timed-m8, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=7 --set LAND_SW_BUY_DAY=8 --set MELON_CELLS=[[0,0],[1,0],[2,0],[3,0],[0,1],[1,1],[2,1],[3,1]]"}
          - {id: timed-m10, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=7 --set LAND_SW_BUY_DAY=8 --set MELON_CELLS=[[0,0],[1,0],[2,0],[3,0],[0,1],[1,1],[2,1],[3,1],[0,2],[1,2]]"}
          - {id: timed-m12, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=7 --set LAND_SW_BUY_DAY=8 --set MELON_CELLS=[[0,0],[1,0],[2,0],[3,0],[0,1],[1,1],[2,1],[3,1],[0,2],[1,2],[2,2],[3,2]]"}
          - {id: timed-fert2, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=7 --set LAND_SW_BUY_DAY=8 --set FERTILIZER_RESERVE=2"}
          - {id: timed-fert4, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=7 --set LAND_SW_BUY_DAY=8 --set FERTILIZER_RESERVE=4"}
          - {id: timed-no-carrot, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=7 --set LAND_SW_BUY_DAY=8 --set CARROT_KAPPA=0.0"}
          - {id: timed-global-straw8, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=7 --set LAND_SW_BUY_DAY=8 --set GLOBAL_CROP_TASKS=true --set STRAWBERRY_TARGET=8 --set STRAWBERRY_START_DAY=8 --set PREMIUM_SEED_BATCH=4"}
          - {id: timed-global-straw16, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=7 --set LAND_SW_BUY_DAY=8 --set GLOBAL_CROP_TASKS=true --set STRAWBERRY_TARGET=16 --set STRAWBERRY_START_DAY=8 --set PREMIUM_SEED_BATCH=6"}
          - {id: timed-herd7c7s, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=7 --set LAND_SW_BUY_DAY=8 --set ANIMAL_TARGETS={\"COW\":7,\"SHEEP\":7}"}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install kaggle-environments
      - name: Test timed expansion and collision-free routing
        working-directory: kaggriculture
        env:
          VARIANT_ARGS: ${{ matrix.args }}
        run: |
          output=$(python replay_benchmark.py --agent agent_v5.py $VARIANT_ARGS)
          echo "$output"
          summary=$(printf '%s\n' "$output" | tail -1)
          echo "::notice title=V6 routing result::$summary"

  v6-land-tune:
    name: V6 land tune ${{ matrix.id }}
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[kaggr-v6-land]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          # Fine timing grid around the routing-sweep winner (NE day 8, SW day 10).
          - {id: n6-s9, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=6 --set LAND_SW_BUY_DAY=9"}
          - {id: n6-s10, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=6 --set LAND_SW_BUY_DAY=10"}
          - {id: n6-s11, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=6 --set LAND_SW_BUY_DAY=11"}
          - {id: n7-s9, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=7 --set LAND_SW_BUY_DAY=9"}
          - {id: n7-s10, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=7 --set LAND_SW_BUY_DAY=10"}
          - {id: n7-s11, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=7 --set LAND_SW_BUY_DAY=11"}
          - {id: n8-s9, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=8 --set LAND_SW_BUY_DAY=9"}
          - {id: n8-s10, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=8 --set LAND_SW_BUY_DAY=10"}
          - {id: n8-s11, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=8 --set LAND_SW_BUY_DAY=11"}
          - {id: n8-s12, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=8 --set LAND_SW_BUY_DAY=12"}
          - {id: n9-s10, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=9 --set LAND_SW_BUY_DAY=10"}
          - {id: n9-s11, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=9 --set LAND_SW_BUY_DAY=11"}
          - {id: n9-s12, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=9 --set LAND_SW_BUY_DAY=12"}
          - {id: n10-s11, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=10 --set LAND_SW_BUY_DAY=11"}
          - {id: n10-s12, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=10 --set LAND_SW_BUY_DAY=12"}
          # Financing sensitivity and interactions around day 8/10.
          - {id: reserve0, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=8 --set LAND_SW_BUY_DAY=10 --set LAND_RESERVE=0"}
          - {id: reserve300, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=8 --set LAND_SW_BUY_DAY=10 --set LAND_RESERVE=300"}
          - {id: reserve500, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=8 --set LAND_SW_BUY_DAY=10 --set LAND_RESERVE=500"}
          - {id: reserve900, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=8 --set LAND_SW_BUY_DAY=10 --set LAND_RESERVE=900"}
          - {id: reserve1100, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=8 --set LAND_SW_BUY_DAY=10 --set LAND_RESERVE=1100"}
          - {id: sale-morning, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=8 --set LAND_SW_BUY_DAY=10 --set SALE_HOURS=[0]"}
          - {id: sale-ticks, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=8 --set LAND_SW_BUY_DAY=10 --set SALE_HOURS=[0,4,8,12,16,20]"}
          - {id: no-carrot, args: "--set LAND_MODE=TIMED --set LAND_NE_BUY_DAY=8 --set LAND_SW_BUY_DAY=10 --set CARROT_KAPPA=0.0"}
