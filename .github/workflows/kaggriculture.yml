          # Static herd controls establish whether adaptation itself matters.
          - {id: herd10c4s, args: "--set ANIMAL_TARGETS={\"COW\":10,\"SHEEP\":4}"}
          - {id: herd9c5s, args: "--set ANIMAL_TARGETS={\"COW\":9,\"SHEEP\":5}"}
