      - name: Install engine
        run: pip install kaggle-environments
      - name: Benchmark combined refinements against all real replay streams
        working-directory: kaggriculture
        env:
          VARIANT_ARGS: ${{ matrix.args }}
        run: |
          output=$(python replay_benchmark.py --agent agent_v5.py --profile mix8-6-f0 $VARIANT_ARGS)
          echo "$output"
          summary=$(printf '%s\n' "$output" | tail -1)
          echo "::notice title=V5 combo result::$summary"

  v5-deep-sweep:
    name: V5 deep ${{ matrix.id }}
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[kaggr-v5-deep]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {id: baseline, args: ""}
          - {id: adapt-t6, args: "--set ADAPT_SHEEP_THRESHOLD=6"}
          - {id: adapt-t8, args: "--set ADAPT_SHEEP_THRESHOLD=8"}
          - {id: adapt-t12, args: "--set ADAPT_SHEEP_THRESHOLD=12"}
          - {id: adapt-t14, args: "--set ADAPT_SHEEP_THRESHOLD=14"}
          - {id: adapt-t16, args: "--set ADAPT_SHEEP_THRESHOLD=16"}
          - {id: no-adapt, args: "--set ADAPT_SHEEP_THRESHOLD=99"}
          - {id: adapt-c9, args: "--set ADAPT_COW_TARGET=9"}
          - {id: adapt-c10, args: "--set ADAPT_COW_TARGET=10"}
          - {id: animals-w2, args: "--per-worker 2"}
          - {id: animals-w4, args: "--per-worker 4"}
          - {id: animals-w5, args: "--per-worker 5"}
