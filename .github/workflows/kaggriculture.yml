          - {id: sell-floor1, args: "--set SELL_PRICE_FLOOR=1"}
          - {id: sell-floor20, args: "--set SELL_PRICE_FLOOR=20"}
          - {id: combo-fast, args: "--set ANIMAL_BUY_BATCH=4 --set HANDS_EXTRA=2 --set OPERATING_RESERVE=200"}
          - {id: combo-safe, args: "--per-worker 2 --feed-days 4 --set OPERATING_RESERVE=500"}
          - {id: combo-efficient, args: "--per-worker 4 --set CELLS_PER_HAND=12 --set HANDS_EXTRA=0"}
          - {id: straw4, args: "--set STRAWBERRY_TARGET=4 --set PREMIUM_SEED_BATCH=4 --set FERTILIZER_RESERVE=6"}
          - {id: straw12, args: "--set STRAWBERRY_TARGET=12 --set PREMIUM_SEED_BATCH=6 --set FERTILIZER_RESERVE=6"}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install kaggle-environments
      - name: Benchmark refinement against all real replay streams
        working-directory: kaggriculture
        env:
          VARIANT_ARGS: ${{ matrix.args }}
        run: |
          # VARIANT_ARGS is repository-controlled matrix data, not user input.
          output=$(python replay_benchmark.py --agent agent_v5.py --profile mix8-6-f0 $VARIANT_ARGS)
          echo "$output"
          summary=$(printf '%s\n' "$output" | tail -1)
          echo "::notice title=V5 deep result::$summary"

  v5-economy-sweep:
    name: V5 economy ${{ matrix.profile }}
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[kaggr-v5-tune]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        profile:
          - cow5
          - cow5-s16
          - cow8-s16
          - sheep6-s16
          - mix5-2
          - mix5-2-s8
          - mix5-2-s16
          - mix5-4
          - mix5-4-s8
          - mix5-4-s16
          - mix5-4-s24
          - mix5-4-s16-f0
          - mix5-4-s16-f24
          - mix5-4-s16-m8
          - mix6-4
          - mix6-4-s8
          - mix6-4-s16
          - mix6-6-s20
          - mix8-4
          - mix10-4
          - mix8-8
          - mix8-6
          - mix8-6-f0
          - mix8-6-s20
          - mix8-6-s28-m12
          - mix11-9
          - mix12-8
          - crop-s42-m12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install kaggle-environments
      - name: Benchmark diversified economy against every real replay
        working-directory: kaggriculture
        run: |
          output=$(python replay_benchmark.py --agent agent_v5.py --profile ${{ matrix.profile }})
          echo "$output"
          summary=$(printf '%s\n' "$output" | tail -1)
          echo "::notice title=V5 economy result::$summary"

  species-sweep:
    name: V4 ${{ matrix.kind }}-${{ matrix.target }}-w${{ matrix.per_worker }}
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[kaggr-v4-tune]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {kind: GOOSE, target: 5, per_worker: 2}
          - {kind: COW, target: 4, per_worker: 2}
          - {kind: COW, target: 5, per_worker: 2}
          - {kind: COW, target: 6, per_worker: 2}
          - {kind: COW, target: 8, per_worker: 2}
          - {kind: SHEEP, target: 4, per_worker: 2}
          - {kind: SHEEP, target: 5, per_worker: 2}
          - {kind: SHEEP, target: 6, per_worker: 2}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install kaggle-environments
      - name: Benchmark species against real replay actions
        working-directory: kaggriculture
        run: |
          output=$(python replay_benchmark.py \
            --animal-kind ${{ matrix.kind }} \
            --animal-target ${{ matrix.target }} \
            --per-worker ${{ matrix.per_worker }} \
            --feed-days 3)
          echo "$output"
          summary=$(printf '%s\n' "$output" | tail -1)
          echo "::notice title=V4 species result::$summary"
