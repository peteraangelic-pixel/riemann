          - {id: lf-melon6, args: "--set LAND_NE_MIN_PLANTED=3 --set LAND_SW_MIN_PLANTED=30 --set MELON_CELLS=[[0,0],[1,0],[2,0],[3,0],[0,1],[1,1]]"}
