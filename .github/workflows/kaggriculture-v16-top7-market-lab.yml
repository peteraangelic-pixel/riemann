name: Kaggriculture V16 TOP7 reactive market LAB
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-v16-top7-market-lab.yml"]
permissions:
  contents: write
jobs:
  market-search:
    if: contains(github.event.head_commit.message, '[kg-v16-market-lab]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install --disable-pip-version-check py7zr
      - name: Extract audited TOP7 corpus
        run: |
          python - <<'PY'
          import py7zr
          with py7zr.SevenZipFile('TOP7.7z') as archive:
              archive.extractall('/tmp/top7')
          PY
      - working-directory: kaggriculture_meta_lab/rust_port
        run: cargo build --release --locked
      - name: Screen 512 state-dependent structural market profiles
        run: |
          python kaggriculture_meta_lab/scripts/screen_market_overlays.py \
            --corpus /tmp/top7 \
            --candidate kaggriculture_meta_lab/agents/variants/agent_v16_kanno_top7_champion.py \
            --binary kaggriculture_meta_lab/rust_port/target/release/kg_sim \
            --population 512 --generation g3 --max-rank 10 --workers 4 \
            --seed 20260910 \
            --output kaggriculture_meta_lab/results/v16-top7-market-g3-20260910.json
      - name: Persist market LAB
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/v16-top7-market-g3-20260910.json
          git commit -m "Record V16 TOP7 reactive market LAB"
          git push origin HEAD:arena/01a0712c-riemann
