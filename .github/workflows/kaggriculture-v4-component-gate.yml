name: V4 selected components final gate
on:
  push:
    branches: ["arena/01a087c0-riemann"]
    paths: [".github/workflows/kaggriculture-v4-component-gate.yml"]
permissions: {contents: write}
jobs:
  gate:
    if: contains(github.event.head_commit.message, '[kg-v4-gate]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install --disable-pip-version-check py7zr
      - run: |
          git fetch origin arena/01a0712c-riemann
          for n in TOP7 TOP15; do git show FETCH_HEAD:$n.7z >/tmp/$n.7z; done
          python - <<'PY'
          import json,pathlib,py7zr
          for n in ('TOP7','TOP15'):
           d=pathlib.Path('/tmp')/n.lower()
           with py7zr.SevenZipFile('/tmp/'+n+'.7z') as z:z.extractall(d)
           m=next(x for x in d.rglob('manifest.json') if 'teams' in json.loads(x.read_text()))
           pathlib.Path('/tmp/'+n.lower()+'-root').write_text(str(m.parent))
          PY
      - working-directory: kaggriculture_meta_lab/rust_port
        run: cargo build --release --locked
      - run: |
          C="--candidate v7=kaggriculture_meta_lab/seat_087c0/candidates/audit-v7.py --candidate m401=kaggriculture_meta_lab/seat_087c0/candidates/audit-v4m401.py --candidate m409=kaggriculture_meta_lab/seat_087c0/candidates/audit-v4m409.py --candidate m401409=kaggriculture_meta_lab/seat_087c0/candidates/audit-v4m401409.py --candidate m360=kaggriculture_meta_lab/seat_087c0/candidates/audit-v4m360.py"
          python kaggriculture_meta_lab/scripts/benchmark_champions_top15_fresh.py --corpus "$(cat /tmp/top7-root)" --workers 4 --seeds 16 --seed-start 144000 $C --output kaggriculture_meta_lab/seat_087c0/results/v4-components-final-top7.json
          python kaggriculture_meta_lab/scripts/benchmark_champions_top15_fresh.py --corpus "$(cat /tmp/top15-root)" --workers 4 --seeds 16 --seed-start 144000 $C --output kaggriculture_meta_lab/seat_087c0/results/v4-components-final-top15.json
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/seat_087c0/results/v4-components-final-*.json
          git commit -m "Record selected V4 components final gate"
          git push origin HEAD:arena/01a087c0-riemann
