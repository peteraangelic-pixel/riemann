name: Kaggriculture V13 V14 final status
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-v14-status.yml"]
permissions:
  contents: write
jobs:
  status:
    if: contains(github.event.head_commit.message, '[kg-v14-status]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install --disable-pip-version-check kaggle
      - env: {KAGGLE_API_TOKEN: "${{ secrets.KAGGLE_API_TOKEN }}"}
        run: |
          mkdir -p ~/.kaggle
          printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]' > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
          kaggle competitions submissions -c kaggriculture --csv > /tmp/status.csv
          python - <<'PY'
          import csv,json
          rows=list(csv.DictReader(open('/tmp/status.csv')))
          selected={r['ref']:r for r in rows if r['ref'] in {'56139063','56139250'}}
          assert set(selected)=={'56139063','56139250'},selected
          json.dump(selected,open('kaggriculture_meta_lab/results/kaggle-v13-v14-final-status-20260910.json','w'),indent=2)
          print(json.dumps(selected,indent=2))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/kaggle-v13-v14-final-status-20260910.json
          git commit -m "Record V13 V14 final Kaggle status"
          git push origin HEAD:arena/01a0712c-riemann
