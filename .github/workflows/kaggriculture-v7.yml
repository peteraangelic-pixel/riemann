name: Kaggriculture V7 phased sweeps

on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths:
      - "kaggriculture/agent_v7.py"
      - "kaggriculture/replay_benchmark.py"
      - "Downloads.zip"
      - "renoir.zip"
      - ".github/workflows/kaggriculture-v7.yml"

jobs:
  phased-ablation:
    name: V7 phase A ${{ matrix.id }}
    if: contains(github.event.head_commit.message, '[kaggr-v7-phase-a]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        include:
          - {id: v6-control, agent: agent_v6.py, args: ""}
          - {id: v7-full, agent: agent_v7.py, args: ""}
          # Premium-capital scale levels.
          - {id: melon6, agent: agent_v7.py, args: "--set MELON_CELLS=[[0,0],[1,0],[2,0],[3,0],[0,1],[1,1]]"}
          - {id: melon8, agent: agent_v7.py, args: "--set MELON_CELLS=[[3,0],[4,0],[2,1],[3,1],[4,1],[1,2],[2,2],[3,2]]"}
          - {id: melon10, agent: agent_v7.py, args: "--set MELON_CELLS=[[3,0],[4,0],[2,1],[3,1],[4,1],[1,2],[2,2],[3,2],[1,3],[2,3]]"}
          - {id: melon12-repeat, agent: agent_v7.py, args: "--set MELON_LAST_PLANT_DAY=18"}
          - {id: melon12-cut10, agent: agent_v7.py, args: "--set MELON_LAST_PLANT_DAY=10"}
          - {id: melon12-cut11, agent: agent_v7.py, args: "--set MELON_LAST_PLANT_DAY=11"}
          # Strawberry estate levels, with all other phases fixed.
          - {id: straw0, agent: agent_v7.py, args: "--set STRAWBERRY_TARGET=0"}
          - {id: straw5, agent: agent_v7.py, args: "--set STRAWBERRY_TARGET=5"}
          - {id: straw13, agent: agent_v7.py, args: "--set STRAWBERRY_TARGET=13"}
          - {id: straw20, agent: agent_v7.py, args: "--set STRAWBERRY_TARGET=20"}
          - {id: straw27, agent: agent_v7.py, args: "--set STRAWBERRY_TARGET=27"}
          - {id: straw33-d3, agent: agent_v7.py, args: "--set STRAWBERRY_START_DAY=3"}
          - {id: straw33-d6, agent: agent_v7.py, args: "--set STRAWBERRY_START_DAY=6"}
          - {id: straw33-b4, agent: agent_v7.py, args: "--set PREMIUM_SEED_BATCH=4"}
          - {id: straw33-b12, agent: agent_v7.py, args: "--set PREMIUM_SEED_BATCH=12"}
          # Animal conversion timing and herd breadth.
          - {id: animals4, agent: agent_v7.py, args: "--set ANIMAL_TARGETS={\"COW\":2,\"SHEEP\":2} --set ANIMAL_ACTIVE_BY_DAY={\"0\":4}"}
          - {id: animals10, agent: agent_v7.py, args: "--set ANIMAL_TARGETS={\"COW\":8,\"SHEEP\":2} --set ANIMAL_ACTIVE_BY_DAY={\"0\":4,\"6\":8,\"7\":10}"}
          - {id: animals14, agent: agent_v7.py, args: "--set ANIMAL_TARGETS={\"COW\":8,\"SHEEP\":6} --set ANIMAL_ACTIVE_BY_DAY={\"0\":4,\"6\":8,\"7\":10,\"9\":13,\"10\":14}"}
          - {id: animals17-all-early, agent: agent_v7.py, args: "--set ANIMAL_ACTIVE_BY_DAY={\"0\":17}"}
          - {id: animals17-late12, agent: agent_v7.py, args: "--set ANIMAL_ACTIVE_BY_DAY={\"0\":4,\"7\":10,\"12\":17}"}
          - {id: herd9c8s, agent: agent_v7.py, args: "--set ANIMAL_TARGETS={\"COW\":9,\"SHEEP\":8}"}
          - {id: herd6c11s, agent: agent_v7.py, args: "--set ANIMAL_TARGETS={\"COW\":6,\"SHEEP\":11}"}
          # Labor phase levels.
          - {id: labor-auto, agent: agent_v7.py, args: "--set LABOR_MODE=AUTO"}
          - {id: labor-industrial, agent: agent_v7.py, args: "--set LABOR_MODE=INDUSTRIAL"}
          - {id: labor-champion, agent: agent_v7.py, args: "--set LABOR_MODE=CHAMPION"}
          - {id: labor-renoir-max14, agent: agent_v7.py, args: "--set HANDS_MAX=14"}
          # Land and fertilizer are isolated from crop scale.
          - {id: land6-10, agent: agent_v7.py, args: "--set LAND_SW_BUY_DAY=10"}
          - {id: land8-10, agent: agent_v7.py, args: "--set LAND_NE_BUY_DAY=8 --set LAND_SW_BUY_DAY=10"}
          - {id: reserve300, agent: agent_v7.py, args: "--set LAND_RESERVE=300"}
          - {id: fert2, agent: agent_v7.py, args: "--set FERTILIZER_RESERVE=2"}
          - {id: fert4, agent: agent_v7.py, args: "--set FERTILIZER_RESERVE=4"}
          - {id: fert8, agent: agent_v7.py, args: "--set FERTILIZER_RESERVE=8"}
          - {id: animal-worker4, agent: agent_v7.py, args: "--set ANIMALS_PER_WORKER=4"}
          - {id: animal-worker2, agent: agent_v7.py, args: "--set ANIMALS_PER_WORKER=2"}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install kaggle-environments
      - name: Test phased V7 component levels
        working-directory: kaggriculture
        env:
          AGENT: ${{ matrix.agent }}
          VARIANT_ARGS: ${{ matrix.args }}
        run: |
          public=$(python replay_benchmark.py --agent "$AGENT" $VARIANT_ARGS)
          printf '%s\n' "$public"
          echo "::notice title=V7 phase A public::$(printf '%s\n' "$public" | tail -1)"
          champion=$(python replay_benchmark.py --agent "$AGENT" --archive Downloads.zip $VARIANT_ARGS)
          printf '%s\n' "$champion"
          echo "::notice title=V7 phase A champion::$(printf '%s\n' "$champion" | tail -1)"
