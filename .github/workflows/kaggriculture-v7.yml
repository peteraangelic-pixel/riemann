name: Kaggriculture V8 regime analysis

on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths:
      - "kaggriculture/agent_v8_fusion.py"
      - "kaggriculture/replay_benchmark.py"
      - ".github/workflows/kaggriculture-v7.yml"

jobs:
  regime-analysis-h:
    name: V8 regime H ${{ matrix.id }}
    if: contains(github.event.head_commit.message, '[kaggr-v8-regime-h]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: renoir-d08-21, source: RENOIR, days: "[8,21]"}
          - {id: aastik-control, source: AASTIK_087, days: "[]"}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install kaggle-environments
      - name: Emit exact loss sets for regime attribution
        working-directory: kaggriculture
        env:
          SOURCE: ${{ matrix.source }}
          DAYS: ${{ matrix.days }}
        run: |
          args=(--set "MOTION_EARLY=$SOURCE" --set "MOTION_LATE=$SOURCE" --set "MARKET_EARLY=$SOURCE" --set "MARKET_LATE=$SOURCE" --set "ORDER_DAYS=$DAYS")
          result=$(python replay_benchmark.py --agent agent_v8_fusion.py --submission 56044395 "${args[@]}")
          printf '%s\n' "$result"
          echo "::notice title=V8 regime public-live::$(printf '%s\n' "$result" | tail -1)"
