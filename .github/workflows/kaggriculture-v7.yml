name: Kaggriculture V7 market refinement

on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths:
      - "kaggriculture/agent_v7_market.py"
      - "kaggriculture/replay_benchmark.py"
      - ".github/workflows/kaggriculture-v7.yml"

jobs:
  market-refinement-e:
    name: V7 market E ${{ matrix.id }}
    if: contains(github.event.head_commit.message, '[kaggr-v7-market-e]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {id: control, days: "[]"}
          - {id: day08, days: "[8]"}
          - {id: day08-21, days: "[8,21]"}
          - {id: day08-16, days: "[8,16]"}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install kaggle-environments
      - name: Validate market finalists on all corpora and new leaders
        working-directory: kaggriculture
        env:
          ORDER_DAYS: ${{ matrix.days }}
        run: |
          variant_args=()
          if [ "$ORDER_DAYS" != "[]" ]; then
            variant_args=(--set ORDER_MODE=SELL_FIRST --set "ORDER_DAYS=$ORDER_DAYS")
          fi
          run_corpus() {
            local title="$1"; shift
            result=$(python replay_benchmark.py --agent agent_v7_market.py "$@" "${variant_args[@]}")
            printf '%s\n' "$result"
            echo "::notice title=V7 market $title::$(printf '%s\n' "$result" | tail -1)"
          }
          run_corpus public-live --submission 56044395
          run_corpus champions --archive Downloads.zip
          run_corpus renoir --archive Renoir.zip
          run_corpus others --archive inni.zip
          run_corpus new-leaders --archive nowe.zip
