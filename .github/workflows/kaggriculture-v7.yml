name: Kaggriculture V8 primitive mining

on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths:
      - "kaggriculture/agent_v8_fusion.py"
      - "kaggriculture/replay_benchmark.py"
      - ".github/workflows/kaggriculture-v7.yml"

jobs:
  market-primitives-l:
    name: V8 primitive L market-${{ matrix.source }}-s${{ matrix.switch }}
    if: contains(github.event.head_commit.message, '[kaggr-v8-primitives-l]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        source: [RENOIR, CROP_294, KEIZ_294, AASTIK_087, CROP_087, KEIZ_811, CROP_811]
        switch: [3, 5, 12, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install kaggle-environments
      - name: Test one opening market primitive over Aastik
        working-directory: kaggriculture
        env:
          SOURCE: ${{ matrix.source }}
          SWITCH_STEP: ${{ matrix.switch }}
        run: |
          args=(--set MOTION_EARLY=AASTIK_087 --set MOTION_LATE=AASTIK_087 --set "MARKET_EARLY=$SOURCE" --set MARKET_LATE=AASTIK_087 --set "MARKET_SWITCH_STEP=$SWITCH_STEP")
          public=$(python replay_benchmark.py --agent agent_v8_fusion.py --submission 56044395 "${args[@]}")
          printf '%s\n' "$public"
          echo "::notice title=V8 primitive public-live::$(printf '%s\n' "$public" | tail -1)"
          leaders=$(python replay_benchmark.py --agent agent_v8_fusion.py --archive nowe.zip "${args[@]}")
          printf '%s\n' "$leaders"
          echo "::notice title=V8 primitive new-leaders::$(printf '%s\n' "$leaders" | tail -1)"

  full-opening-primitives-l:
    name: V8 primitive L full-${{ matrix.source }}-d1
    if: contains(github.event.head_commit.message, '[kaggr-v8-primitives-l]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        source: [RENOIR, CROP_294, KEIZ_294, CROP_087, KEIZ_811, CROP_811]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install kaggle-environments
      - name: Test a complete one-day opening primitive before Aastik
        working-directory: kaggriculture
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          args=(--set "MOTION_EARLY=$SOURCE" --set MOTION_LATE=AASTIK_087 --set MOTION_SWITCH_DAY=1 --set "MARKET_EARLY=$SOURCE" --set MARKET_LATE=AASTIK_087 --set MARKET_SWITCH_STEP=24)
          public=$(python replay_benchmark.py --agent agent_v8_fusion.py --submission 56044395 "${args[@]}")
          printf '%s\n' "$public"
          echo "::notice title=V8 primitive public-live::$(printf '%s\n' "$public" | tail -1)"
          leaders=$(python replay_benchmark.py --agent agent_v8_fusion.py --archive nowe.zip "${args[@]}")
          printf '%s\n' "$leaders"
          echo "::notice title=V8 primitive new-leaders::$(printf '%s\n' "$leaders" | tail -1)"
