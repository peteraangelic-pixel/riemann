name: Kaggriculture V7 replay reconstruction

on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths:
      - "kaggriculture/agent_v7.py"
      - "kaggriculture/agent_v7_scripted.py"
      - "kaggriculture/replay_benchmark.py"
      - ".github/workflows/kaggriculture-v7.yml"

jobs:
  reconstruction:
    name: V7 reconstruction ${{ matrix.id }}
    if: contains(github.event.head_commit.message, '[kaggr-v7-reconstruct]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {id: v6-control, agent: agent_v6.py, args: ""}
          - {id: v7-planner, agent: agent_v7.py, args: ""}
          - {id: script-auto-clamp, agent: agent_v7_scripted.py, args: "--set CLAMP_SELL=true"}
          - {id: script-auto-raw, agent: agent_v7_scripted.py, args: ""}
          - {id: script-p0-clamp, agent: agent_v7_scripted.py, args: "--set SEAT_MODE=P0 --set CLAMP_SELL=true"}
          - {id: script-p0-raw, agent: agent_v7_scripted.py, args: "--set SEAT_MODE=P0 --set CLAMP_SELL=false"}
          - {id: script-p1-clamp, agent: agent_v7_scripted.py, args: "--set SEAT_MODE=P1 --set CLAMP_SELL=true"}
          - {id: script-p1-raw, agent: agent_v7_scripted.py, args: "--set SEAT_MODE=P1 --set CLAMP_SELL=false"}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install kaggle-environments
      - name: Cross-validate reconstructed schedule on four corpora
        working-directory: kaggriculture
        env:
          AGENT: ${{ matrix.agent }}
          VARIANT_ARGS: ${{ matrix.args }}
        run: |
          public=$(python replay_benchmark.py --agent "$AGENT" $VARIANT_ARGS)
          printf '%s\n' "$public"
          echo "::notice title=V7 reconstruct public::$(printf '%s\n' "$public" | tail -1)"
          champions=$(python replay_benchmark.py --agent "$AGENT" --archive Downloads.zip $VARIANT_ARGS)
          printf '%s\n' "$champions"
          echo "::notice title=V7 reconstruct champions::$(printf '%s\n' "$champions" | tail -1)"
          renoir=$(python replay_benchmark.py --agent "$AGENT" --archive Renoir.zip $VARIANT_ARGS)
          printf '%s\n' "$renoir"
          echo "::notice title=V7 reconstruct renoir::$(printf '%s\n' "$renoir" | tail -1)"
          others=$(python replay_benchmark.py --agent "$AGENT" --archive inni.zip $VARIANT_ARGS)
          printf '%s\n' "$others"
          echo "::notice title=V7 reconstruct others::$(printf '%s\n' "$others" | tail -1)"
