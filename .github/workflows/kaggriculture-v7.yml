name: Kaggriculture V7 market day isolation

on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths:
      - "kaggriculture/agent_v7_market.py"
      - "kaggriculture/replay_benchmark.py"
      - "kaggriculture/V7_EXPERIMENT_LOG.md"
      - ".github/workflows/kaggriculture-v7.yml"

jobs:
  market-refinement:
    name: V7 market B ${{ matrix.id }}
    if: contains(github.event.head_commit.message, '[kaggr-v7-market-b]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        include:
          - {id: control, args: ""}
          - {id: sell-all-days, args: "--set ORDER_MODE=SELL_FIRST"}
          - {id: sell-day-00, args: "--set ORDER_MODE=SELL_FIRST --set ORDER_DAYS=[0]"}
          - {id: sell-day-01, args: "--set ORDER_MODE=SELL_FIRST --set ORDER_DAYS=[1]"}
          - {id: sell-day-02, args: "--set ORDER_MODE=SELL_FIRST --set ORDER_DAYS=[2]"}
          - {id: sell-day-03, args: "--set ORDER_MODE=SELL_FIRST --set ORDER_DAYS=[3]"}
          - {id: sell-day-04, args: "--set ORDER_MODE=SELL_FIRST --set ORDER_DAYS=[4]"}
          - {id: sell-day-05, args: "--set ORDER_MODE=SELL_FIRST --set ORDER_DAYS=[5]"}
          - {id: sell-day-06, args: "--set ORDER_MODE=SELL_FIRST --set ORDER_DAYS=[6]"}
          - {id: sell-day-07, args: "--set ORDER_MODE=SELL_FIRST --set ORDER_DAYS=[7]"}
          - {id: sell-day-08, args: "--set ORDER_MODE=SELL_FIRST --set ORDER_DAYS=[8]"}
          - {id: sell-day-09, args: "--set ORDER_MODE=SELL_FIRST --set ORDER_DAYS=[9]"}
          - {id: sell-day-10, args: "--set ORDER_MODE=SELL_FIRST --set ORDER_DAYS=[10]"}
          - {id: sell-day-11, args: "--set ORDER_MODE=SELL_FIRST --set ORDER_DAYS=[11]"}
          - {id: sell-day-12, args: "--set ORDER_MODE=SELL_FIRST --set ORDER_DAYS=[12]"}
          - {id: sell-day-13, args: "--set ORDER_MODE=SELL_FIRST --set ORDER_DAYS=[13]"}
          - {id: sell-day-14, args: "--set ORDER_MODE=SELL_FIRST --set ORDER_DAYS=[14]"}
          - {id: sell-day-15, args: "--set ORDER_MODE=SELL_FIRST --set ORDER_DAYS=[15]"}
          - {id: sell-day-16, args: "--set ORDER_MODE=SELL_FIRST --set ORDER_DAYS=[16]"}
          - {id: sell-day-17, args: "--set ORDER_MODE=SELL_FIRST --set ORDER_DAYS=[17]"}
          - {id: sell-day-18, args: "--set ORDER_MODE=SELL_FIRST --set ORDER_DAYS=[18]"}
          - {id: sell-day-19, args: "--set ORDER_MODE=SELL_FIRST --set ORDER_DAYS=[19]"}
          - {id: sell-day-20, args: "--set ORDER_MODE=SELL_FIRST --set ORDER_DAYS=[20]"}
          - {id: sell-day-21, args: "--set ORDER_MODE=SELL_FIRST --set ORDER_DAYS=[21]"}
          - {id: sell-day-22, args: "--set ORDER_MODE=SELL_FIRST --set ORDER_DAYS=[22]"}
          - {id: sell-day-23, args: "--set ORDER_MODE=SELL_FIRST --set ORDER_DAYS=[23]"}
          - {id: sell-day-24, args: "--set ORDER_MODE=SELL_FIRST --set ORDER_DAYS=[24]"}
          - {id: sell-day-25, args: "--set ORDER_MODE=SELL_FIRST --set ORDER_DAYS=[25]"}
          - {id: sell-day-26, args: "--set ORDER_MODE=SELL_FIRST --set ORDER_DAYS=[26]"}
          - {id: sell-day-27, args: "--set ORDER_MODE=SELL_FIRST --set ORDER_DAYS=[27]"}
          - {id: sell-day-28, args: "--set ORDER_MODE=SELL_FIRST --set ORDER_DAYS=[28]"}
          - {id: sell-day-29, args: "--set ORDER_MODE=SELL_FIRST --set ORDER_DAYS=[29]"}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install kaggle-environments
      - name: Isolate sell-first ordering one day at a time
        working-directory: kaggriculture
        env:
          VARIANT_ARGS: ${{ matrix.args }}
        run: |
          public=$(python replay_benchmark.py --agent agent_v7_market.py $VARIANT_ARGS)
          printf '%s\n' "$public"
          echo "::notice title=V7 market public::$(printf '%s\n' "$public" | tail -1)"
          champions=$(python replay_benchmark.py --agent agent_v7_market.py --archive Downloads.zip $VARIANT_ARGS)
          printf '%s\n' "$champions"
          echo "::notice title=V7 market champions::$(printf '%s\n' "$champions" | tail -1)"
          renoir=$(python replay_benchmark.py --agent agent_v7_market.py --archive Renoir.zip $VARIANT_ARGS)
          printf '%s\n' "$renoir"
          echo "::notice title=V7 market renoir::$(printf '%s\n' "$renoir" | tail -1)"
          others=$(python replay_benchmark.py --agent agent_v7_market.py --archive inni.zip $VARIANT_ARGS)
          printf '%s\n' "$others"
          echo "::notice title=V7 market others::$(printf '%s\n' "$others" | tail -1)"
