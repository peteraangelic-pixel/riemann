name: Kaggriculture V7 market refinement

on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths:
      - "kaggriculture/agent_v7_market.py"
      - "kaggriculture/replay_benchmark.py"
      - "kaggriculture/V7_EXPERIMENT_LOG.md"
      - ".github/workflows/kaggriculture-v7.yml"

jobs:
  market-refinement-c:
    name: V7 market C ${{ matrix.id }}
    if: contains(github.event.head_commit.message, '[kaggr-v7-market-c]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        include:
          - {id: control, days: "[]"}
          - {id: d04, days: "[4]"}
          - {id: d08, days: "[8]"}
          - {id: d15, days: "[15]"}
          - {id: d16, days: "[16]"}
          - {id: d21, days: "[21]"}
          - {id: d26, days: "[26]"}
          - {id: d27, days: "[27]"}
          - {id: d04-08, days: "[4,8]"}
          - {id: d08-15, days: "[8,15]"}
          - {id: d08-16, days: "[8,16]"}
          - {id: d08-21, days: "[8,21]"}
          - {id: d08-26, days: "[8,26]"}
          - {id: d08-27, days: "[8,27]"}
          - {id: d15-16, days: "[15,16]"}
          - {id: d21-26, days: "[21,26]"}
          - {id: d26-27, days: "[26,27]"}
          - {id: d08-15-16, days: "[8,15,16]"}
          - {id: d08-21-26, days: "[8,21,26]"}
          - {id: d08-26-27, days: "[8,26,27]"}
          - {id: d15-16-21, days: "[15,16,21]"}
          - {id: d21-26-27, days: "[21,26,27]"}
          - {id: d08-15-16-21, days: "[8,15,16,21]"}
          - {id: d08-21-26-27, days: "[8,21,26,27]"}
          - {id: d08-15-16-21-26-27, days: "[8,15,16,21,26,27]"}
          - {id: d04-08-15-16-21-26-27, days: "[4,8,15,16,21,26,27]"}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install kaggle-environments
      - name: Test independently beneficial sell-first days and interactions
        working-directory: kaggriculture
        env:
          ORDER_DAYS: ${{ matrix.days }}
        run: |
          if [ "$ORDER_DAYS" = "[]" ]; then
            variant_args=()
          else
            variant_args=(--set ORDER_MODE=SELL_FIRST --set "ORDER_DAYS=$ORDER_DAYS")
          fi
          public=$(python replay_benchmark.py --agent agent_v7_market.py --submission 56044395 "${variant_args[@]}")
          printf '%s\n' "$public"
          echo "::notice title=V7 market public-live::$(printf '%s\n' "$public" | tail -1)"
          champions=$(python replay_benchmark.py --agent agent_v7_market.py --archive Downloads.zip "${variant_args[@]}")
          printf '%s\n' "$champions"
          echo "::notice title=V7 market champions::$(printf '%s\n' "$champions" | tail -1)"
          renoir=$(python replay_benchmark.py --agent agent_v7_market.py --archive Renoir.zip "${variant_args[@]}")
          printf '%s\n' "$renoir"
          echo "::notice title=V7 market renoir::$(printf '%s\n' "$renoir" | tail -1)"
          others=$(python replay_benchmark.py --agent agent_v7_market.py --archive inni.zip "${variant_args[@]}")
          printf '%s\n' "$others"
          echo "::notice title=V7 market others::$(printf '%s\n' "$others" | tail -1)"
