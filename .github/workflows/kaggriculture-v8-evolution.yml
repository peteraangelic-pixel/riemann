name: Kaggriculture V8 V6-V7 evolutionary LAB
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-v8-evolution.yml"]
permissions:
  contents: write
jobs:
  evolve:
    if: contains(github.event.head_commit.message, '[kg-v8-evolution]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install --disable-pip-version-check py7zr
      - name: Extract complete TOP15 corpus
        run: |
          python - <<'PY'
          import os,pathlib,py7zr
          with py7zr.SevenZipFile('TOP15.7z') as a:a.extractall('/tmp/top15')
          ms=list(pathlib.Path('/tmp/top15').rglob('manifest.json'))
          root=ms[0].parent if len(ms)==1 else pathlib.Path(os.path.commonpath([str(x.parent) for x in ms]))
          pathlib.Path('/tmp/top15-root').write_text(str(root))
          print(root,len(ms))
          PY
      - working-directory: kaggriculture_meta_lab/rust_port
        run: cargo build --release --locked
      - name: Three evolutionary generations and eight-seed holdout
        run: |
          python kaggriculture_meta_lab/scripts/search_v8_opening_evolution.py \
            --corpus "$(cat /tmp/top15-root)" \
            --binary kaggriculture_meta_lab/rust_port/target/release/kg_sim \
            --population 160 --generations 3 --threads 4 \
            --output kaggriculture_meta_lab/results/v8-opening-evolution-20260910.json \
            --agent-output kaggriculture_meta_lab/agents/candidates/agent_v8_evolved_opening.py
      - name: Independent matched finalist gate
        run: |
          python -m py_compile kaggriculture_meta_lab/agents/candidates/agent_v8_evolved_opening.py
          python kaggriculture_meta_lab/scripts/benchmark_champions_top15_fresh.py \
            --corpus "$(cat /tmp/top15-root)" --workers 4 --seeds 8 --seed-start 122000 \
            --candidate v16=kaggriculture_meta_lab/agents/variants/agent_v16_kanno_top7_champion.py \
            --candidate v6=kaggriculture_meta_lab/agents/candidates/agent_v6_safe_opening.py \
            --candidate v7=kaggriculture_meta_lab/agents/candidates/agent_v7_market_probe.py \
            --candidate v8=kaggriculture_meta_lab/agents/candidates/agent_v8_evolved_opening.py \
            --output kaggriculture_meta_lab/results/v8-independent-top15-fresh-20260910.json
      - name: Persist population evidence and finalist
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/v8-opening-evolution-20260910.json \
            kaggriculture_meta_lab/results/v8-independent-top15-fresh-20260910.json \
            kaggriculture_meta_lab/agents/candidates/agent_v8_evolved_opening.py
          git commit -m "Record V8 evolutionary LAB"
          git push origin HEAD:arena/01a0712c-riemann
