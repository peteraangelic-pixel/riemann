name: Kaggriculture V16 promotion gate
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-v16-promotion-gate.yml"]
permissions: {contents: write}
jobs:
  gate:
    if: contains(github.event.head_commit.message, '[kg-v16-gate]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install --disable-pip-version-check py7zr
      - run: |
          python - <<'PY'
          import json,pathlib,py7zr
          for arc,dst,n in [('TOP12.7z','/tmp/c',12),('TOP7.7z','/tmp/p',7)]:
           with py7zr.SevenZipFile(arc) as z:z.extractall(dst)
           roots=[m.parent for m in pathlib.Path(dst).rglob('manifest.json') if len(json.loads(m.read_text()).get('teams',[]))==n]
           assert len(roots)==1;pathlib.Path(dst+'.root').write_text(str(roots[0]))
          PY
      - working-directory: kaggriculture_meta_lab/rust_port
        run: cargo build --release --locked
      - name: Current TOP12 promotion panel
        run: |
          python kaggriculture_meta_lab/scripts/benchmark_champions_top15_fresh.py --corpus "$(cat /tmp/c.root)" --workers 4 --seeds 8 --seed-start 193000 \
           --candidate v16=kaggriculture_meta_lab/agents/candidates/agent_v16_current_animal_crossover.py --candidate parent=kaggriculture_meta_lab/agents/v13_parents/p097.py \
           --candidate v8=kaggriculture_meta_lab/agents/candidates/agent_v8_late401_official.py --candidate g2=kaggriculture_meta_lab/agents/candidates/agent_v8_control_g2_open_loop.py \
           --candidate v2=kaggriculture_meta_lab/agents/variants/agent_v16_kanno_top7_champion.py --candidate v7=kaggriculture_meta_lab/agents/candidates/agent_v7_market_probe.py \
           --output kaggriculture_meta_lab/results/v16-current-top12-promotion-20260912.json
      - name: Previous TOP7 transfer panel
        run: |
          python kaggriculture_meta_lab/scripts/benchmark_champions_top15_fresh.py --corpus "$(cat /tmp/p.root)" --workers 4 --seeds 4 --seed-start 194000 \
           --candidate v16=kaggriculture_meta_lab/agents/candidates/agent_v16_current_animal_crossover.py --candidate parent=kaggriculture_meta_lab/agents/v13_parents/p097.py \
           --candidate v8=kaggriculture_meta_lab/agents/candidates/agent_v8_late401_official.py --candidate g2=kaggriculture_meta_lab/agents/candidates/agent_v8_control_g2_open_loop.py \
           --candidate v2=kaggriculture_meta_lab/agents/variants/agent_v16_kanno_top7_champion.py --candidate v7=kaggriculture_meta_lab/agents/candidates/agent_v7_market_probe.py \
           --output kaggriculture_meta_lab/results/v16-previous-top7-promotion-20260912.json
      - run: |
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/v16-*-promotion-20260912.json;git commit -m 'Record V16 promotion gate'
          git pull --rebase origin arena/01a0712c-riemann;git push origin HEAD:arena/01a0712c-riemann
