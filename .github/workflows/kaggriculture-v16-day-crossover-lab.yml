name: Kaggriculture V16 coherent day-crossover LAB
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-v16-day-crossover-lab.yml"]
permissions:
  contents: write
jobs:
  search:
    if: contains(github.event.head_commit.message, '[kg-v16-day-lab]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build validated native simulator
        working-directory: kaggriculture_meta_lab/rust_port
        run: cargo build --release --locked
      - name: Search 256 coherent day-level plans and fresh holdout
        run: |
          python kaggriculture_meta_lab/scripts/search_kanno_german_day_crossover.py \
            --binary kaggriculture_meta_lab/rust_port/target/release/kg_sim \
            --population 256 --threads 4 \
            --output kaggriculture_meta_lab/results/v16-day-crossover-lab-20260910.json \
            --agent-output kaggriculture_meta_lab/agents/candidates/v16_day_crossover_holdout_winner.py
      - name: Persist result and optional qualified candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/v16-day-crossover-lab-20260910.json
          if test -f kaggriculture_meta_lab/agents/candidates/v16_day_crossover_holdout_winner.py; then
            python -m py_compile kaggriculture_meta_lab/agents/candidates/v16_day_crossover_holdout_winner.py
            git add kaggriculture_meta_lab/agents/candidates/v16_day_crossover_holdout_winner.py
          fi
          git commit -m "Record V16 coherent day-crossover LAB"
          git push origin HEAD:arena/01a0712c-riemann
