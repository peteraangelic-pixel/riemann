name: Kaggriculture V3 market winner independent gate
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-v3-market-winner-gate.yml"]
permissions:
  contents: write
jobs:
  gate:
    if: contains(github.event.head_commit.message, '[kg-v3-winner-gate]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: kaggriculture_meta_lab/rust_port
        run: cargo build --release --locked
      - run: |
          python kaggriculture_meta_lab/scripts/validate_v3_market_winner.py \
            --binary kaggriculture_meta_lab/rust_port/target/release/kg_sim \
            --output kaggriculture_meta_lab/results/v3-market-winner-independent-gate-20260910.json --threads 4
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/v3-market-winner-independent-gate-20260910.json
          git commit -m "Record V3 market winner independent gate"
          git push origin HEAD:arena/01a0712c-riemann
