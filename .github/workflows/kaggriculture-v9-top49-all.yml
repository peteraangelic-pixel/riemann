name: Kaggriculture V9 all-five TOP49 validation
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths:
      - "kaggriculture/research/screen_top49_all.py"
      - ".github/workflows/kaggriculture-v9-top49-all.yml"
permissions:
  contents: write
jobs:
  validate:
    if: contains(github.event.head_commit.message, '[kaggr-v9-all5]')
    name: ${{ matrix.agent }} shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        agent: [v7_scripted, v8_aastik, v8_hybrid, v9_b09_s05, v9_b11_s07]
        shard: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install kaggle-environments
      - name: Validate on all five tapes
        env:
          AGENT: ${{ matrix.agent }}
          SHARD: ${{ matrix.shard }}
        run: |
          case "$AGENT" in
            v7_scripted) path=kaggriculture/agent_v7_scripted.py ;;
            v8_aastik) path=kaggriculture/agent_v8_aastik.py ;;
            v8_hybrid) path=kaggriculture/agent_v8_hybrid.py ;;
            v9_b09_s05) path=kaggriculture/v9_candidates/wheat_grid/agent_v9_wheat_b09_s05.py ;;
            v9_b11_s07) path=kaggriculture/v9_candidates/wheat_grid/agent_v9_wheat_b11_s07.py ;;
          esac
          set -o pipefail
          python kaggriculture/research/screen_top49_all.py --agent "$path" --shard "$SHARD" | tee /tmp/output.txt
          mkdir -p result
          grep '^SHARD_JSON=' /tmp/output.txt | tail -1 | sed 's/^SHARD_JSON=//' > "result/${AGENT}_${SHARD}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.agent }}-${{ matrix.shard }}
          path: result/*.json

  aggregate:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results
          merge-multiple: true
      - name: Aggregate identical all-five comparison
        run: |
          python - <<'PY' | tee summary.txt
          import collections,glob,json
          groups=collections.defaultdict(list); output=[]
          for path in glob.glob('results/*.json'):
              agent=path.rsplit('/',1)[-1].rsplit('_',1)[0]
              groups[agent].append(json.load(open(path)))
          for agent, rows in sorted(groups.items()):
              episodes=sum(x['episodes'] for x in rows); games=sum(x['games'] for x in rows)
              avg=lambda key: sum(x[key]*x['episodes'] for x in rows)/episodes
              out={'agent':agent,'shards':len(rows),'episodes':episodes,'games':games,'wins':sum(x['wins'] for x in rows),'our_mean':avg('our_mean'),'opponent_mean':avg('opponent_mean'),'margin_mean':avg('margin_mean')}
              output.append(out); print('ALL5_JSON='+json.dumps(out,separators=(',',':')))
          open('kaggriculture_top49_all5_results.json','w').write(json.dumps(output,indent=2)+'\n')
          PY
          while read -r summary; do
            title=$(python -c 'import json,sys;print(json.loads(sys.argv[1][10:])["agent"])' "$summary")
            echo "::warning file=summary.txt,title=$title::$summary"
          done < summary.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv kaggriculture_top49_all5_results.json kaggriculture/research/TOP49_ALL5_RESULTS.json
          git add kaggriculture/research/TOP49_ALL5_RESULTS.json
          git commit -m "research(kaggriculture): record all-five TOP49 validation [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
