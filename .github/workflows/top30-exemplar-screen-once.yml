name: Current TOP30 exemplar screen once

on:
  push:
    branches: [arena/01a0712c-riemann]
    paths: [.github/workflows/top30-exemplar-screen-once.yml]

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git checkout -B arena/01a0712c-riemann origin/arena/01a0712c-riemann
      - uses: dtolnay/rust-toolchain@1.85.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kaggriculture_meta_lab/rust_port
      - name: Extract audited replay snapshot
        run: |
          python -m pip install --disable-pip-version-check py7zr
          python - <<'PY'
          import os, py7zr
          target = os.path.join(os.environ['RUNNER_TEMP'], 'top30')
          with py7zr.SevenZipFile('TOP30.7z') as archive:
              archive.extractall(target)
          PY
      - name: Build native simulator
        working-directory: kaggriculture_meta_lab/rust_port
        run: cargo build --release --locked
      - name: Screen controls and TOP10 exemplars
        run: |
          python kaggriculture_meta_lab/scripts/screen_top30_exemplars.py \
            --corpus "$RUNNER_TEMP/top30/TOP30" \
            --workers 4 \
            --output kaggriculture_meta_lab/results/top30-exemplar-screen-20260908.json
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/top30-exemplar-screen-20260908.json
          git commit -m 'data(kaggriculture): record current TOP30 exemplar screen'
          git push origin HEAD:arena/01a0712c-riemann
