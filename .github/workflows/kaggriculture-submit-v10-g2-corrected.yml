name: Kaggriculture corrected G2-83 submission # final status check
on:
  workflow_dispatch:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-submit-v10-g2-corrected.yml"]
permissions:
  contents: write
jobs:
  status:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[kg-g2-status]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Configure Kaggle token
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p ~/.kaggle
          printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]' > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
      - run: pip install --disable-pip-version-check kaggle
      - name: Persist corrected submission status
        run: |
          kaggle competitions submissions kaggriculture -v | head -5 > kaggriculture_meta_lab/results/kaggle-g2-corrected-status-20260909.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/kaggle-g2-corrected-status-20260909.txt
          git commit -m "Record corrected G2 Kaggle status"
          git push origin HEAD:arena/01a0712c-riemann
  validate-and-submit:
    if: contains(github.event.head_commit.message, '[kaggr-submit-g2-corrected]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Compile and enforce compact standalone package
        run: |
          python -m py_compile kaggriculture_meta_lab/agents/variants/agent_v10_subin_g2_83.py
          test $(wc -c < kaggriculture_meta_lab/agents/variants/agent_v10_subin_g2_83.py) -lt 15000
      - name: Validate exact packaged agent in pinned Kaggle framework
        run: |
          pip install --disable-pip-version-check kaggle-environments==1.32.7
          python - <<'PY'
          import runpy
          from kaggle_environments import make
          agent = runpy.run_path('kaggriculture_meta_lab/agents/variants/agent_v10_subin_g2_83.py')['agent']
          for opponent in ('pass', 'random', 'starter'):
              for seat in (0, 1):
                  players = [agent, opponent] if seat == 0 else [opponent, agent]
                  env = make('kaggriculture', configuration={'episodeSteps': 720, 'seed': 83}, debug=True)
                  env.run(players)
                  assert str(env.state[seat].status) == 'DONE', (opponent, seat, env.state[seat])
          print('six actual-framework validation games completed with DONE status')
          PY
      - name: Configure Kaggle token
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p ~/.kaggle
          clean_token=$(printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]')
          test -n "$clean_token" || { echo '::error::KAGGLE_API_TOKEN is missing'; exit 1; }
          printf '%s' "$clean_token" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
      - run: pip install --disable-pip-version-check kaggle
      - name: Package and upload corrected authorized G2-83
        run: |
          work=$(mktemp -d)
          cp kaggriculture_meta_lab/agents/variants/agent_v10_subin_g2_83.py "$work/main.py"
          tar -C "$work" -czf "$work/submission-v10-subin-g2-83-corrected.tar.gz" main.py
          test $(wc -c < "$work/submission-v10-subin-g2-83-corrected.tar.gz") -lt 15000
          kaggle competitions submit -c kaggriculture \
            -f "$work/submission-v10-subin-g2-83-corrected.tar.gz" \
            -m "V10 G2-83 corrected compact exact-policy framework-validated $GITHUB_SHA"
          sleep 8
          kaggle competitions submissions kaggriculture -v | head -5
