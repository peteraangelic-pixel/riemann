name: Kaggriculture submit V14 milk-zero refinement
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-submit-v14-milk0.yml"]
permissions:
  contents: write
jobs:
  submit:
    if: contains(github.event.head_commit.message, '[kaggr-submit-v14-milk0]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install --disable-pip-version-check kaggle
      - name: Compile and package exact promoted agent
        run: |
          python -m py_compile kaggriculture_meta_lab/agents/variants/agent_v14_subin_g2_milk0.py
          work=$(mktemp -d)
          cp kaggriculture_meta_lab/agents/variants/agent_v14_subin_g2_milk0.py "$work/main.py"
          tar -C "$work" -czf "$work/submission-v14-subin-g2-milk0.tar.gz" main.py
          test $(wc -c < "$work/submission-v14-subin-g2-milk0.tar.gz") -lt 100000000
          echo "$work" > /tmp/workdir
      - name: Configure token and submit
        env: {KAGGLE_API_TOKEN: "${{ secrets.KAGGLE_API_TOKEN }}"}
        run: |
          mkdir -p ~/.kaggle
          printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]' > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
          work=$(cat /tmp/workdir)
          kaggle competitions submit -c kaggriculture \
            -f "$work/submission-v14-subin-g2-milk0.tar.gz" \
            -m "V14 G2 milk0 29-3 vs submitted G2 authorized continuation $GITHUB_SHA"
          sleep 15
          kaggle competitions submissions -c kaggriculture --csv > kaggriculture_meta_lab/results/kaggle-v14-milk0-status-20260910.csv
          python - <<'PY'
          import csv,json
          rows=list(csv.DictReader(open('kaggriculture_meta_lab/results/kaggle-v14-milk0-status-20260910.csv')))
          row=next(r for r in rows if 'V14 G2 milk0' in r['description'])
          json.dump(row,open('kaggriculture_meta_lab/results/kaggle-v14-milk0-submission-20260910.json','w'),indent=2)
          print(row)
          PY
      - name: Persist submission reference
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/kaggle-v14-milk0-status-20260910.csv kaggriculture_meta_lab/results/kaggle-v14-milk0-submission-20260910.json
          git commit -m "Record V14 milk-zero Kaggle submission"
          git push origin HEAD:arena/01a0712c-riemann
