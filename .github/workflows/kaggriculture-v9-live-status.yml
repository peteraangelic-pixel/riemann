name: Kaggriculture V9 live status
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-v9-live-status.yml"]
jobs:
  status:
    if: contains(github.event.head_commit.message, '[kaggr-v9-status]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Configure Kaggle token
        env: {KAGGLE_API_TOKEN: "${{ secrets.KAGGLE_API_TOKEN }}"}
        run: |
          mkdir -p ~/.kaggle
          clean_token=$(printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]')
          test -n "$clean_token" || exit 1
          printf '%s' "$clean_token" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
      - run: pip install kaggle
      - name: Read submissions
        run: |
          output=$(kaggle competitions submissions kaggriculture 2>&1)
          printf '%s\n' "$output"
          safe=${output//'%'/'%25'}; safe=${safe//$'\n'/'%0A'}; safe=${safe//$'\r'/'%0D'}
          echo "::notice title=Kaggriculture submissions::$safe"
