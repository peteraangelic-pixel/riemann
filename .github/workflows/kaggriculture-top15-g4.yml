name: Kaggriculture TOP15 structural Generation 4
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-top15-g4.yml"]
permissions:
  contents: write
jobs:
  structural-g4:
    if: contains(github.event.head_commit.message, '[kg-top15-g4]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: dtolnay/rust-toolchain@stable
      - name: Extract audited TOP15 and build Rust
        run: |
          pip install --disable-pip-version-check py7zr
          mkdir -p /tmp/top15
          python - <<'PY'
          import py7zr
          with py7zr.SevenZipFile('TOP15.7z') as archive:
              archive.extractall('/tmp/top15')
          PY
          python kaggriculture_meta_lab/scripts/audit_top15.py /tmp/top15/TOP15 --archive TOP15.7z --output /tmp/g4-audit.json
          cd kaggriculture_meta_lab/rust_port
          cargo fmt --check
          cargo test --locked
          cargo build --release --locked
      - name: G4 progressive local structural funnel
        env:
          PYTHONPATH: kaggriculture_meta_lab
        run: |
          python kaggriculture_meta_lab/scripts/screen_market_overlays.py \
            --corpus /tmp/top15/TOP15 --generation g4 --population 96 \
            --parents-from kaggriculture_meta_lab/results/top15-structural-g3-top10-20260909.json \
            --max-rank 5 --workers 2 --output /tmp/g4-top5.json
          python kaggriculture_meta_lab/scripts/screen_market_overlays.py \
            --corpus /tmp/top15/TOP15 --profiles-from /tmp/g4-top5.json \
            --max-rank 10 --workers 2 --output /tmp/g4-top10.json
          python kaggriculture_meta_lab/scripts/screen_market_overlays.py \
            --corpus /tmp/top15/TOP15 --profiles-from /tmp/g4-top10.json \
            --max-rank 15 --workers 2 --output /tmp/g4-top15.json
      - name: Persist fail-closed G4 records
        run: |
          cp /tmp/g4-top5.json kaggriculture_meta_lab/results/top15-structural-g4-top5-20260909.json
          cp /tmp/g4-top10.json kaggriculture_meta_lab/results/top15-structural-g4-top10-20260909.json
          cp /tmp/g4-top15.json kaggriculture_meta_lab/results/top15-structural-g4-top15-20260909.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/top15-structural-g4-*.json
          git commit -m "Record TOP15 structural Generation 4 funnel"
          git push origin HEAD:arena/01a0712c-riemann
