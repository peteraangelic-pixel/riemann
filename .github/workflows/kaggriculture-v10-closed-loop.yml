name: Kaggriculture late-market adaptive validation
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-v10-closed-loop.yml"]
permissions: {contents: write}
jobs:
  validate:
    if: contains(github.event.head_commit.message, '[kg-v10-validate]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install --disable-pip-version-check kaggle-environments
      - name: Closed-loop both-seat panel
        env: {PYTHONPATH: kaggriculture_meta_lab}
        run: |
          python - <<'PY'
          import json,statistics
          from kaggriculture_lab.tournament import build_jobs,run
          v10='kaggriculture_meta_lab/agents/candidates/agent_v10_late_market_adaptive.py'
          opponents={'v9':'kaggriculture_meta_lab/agents/candidates/agent_v9_market_adaptive.py','g2':'kaggriculture_meta_lab/agents/ref/agent_v10_subin_g2_83.py'}
          out={'format':'closed-loop-both-seats-v1','candidate':v10,'seeds':[168000,168015],'opponents':{}}
          for name,opp in opponents.items():
           rows=run(build_jobs(v10,[opp],16,168000,swap_seats=True,tag=name),4,progress_every=16)
           if any(r.get('error') for r in rows):raise RuntimeError([r for r in rows if r.get('error')][:3])
           n=len(rows);w=sum(r['margin']>0 for r in rows);l=sum(r['margin']<0 for r in rows)
           out['opponents'][name]={'games':n,'wins':w,'losses':l,'ties':n-w-l,'mean_candidate_reward':statistics.mean(r['self_reward'] for r in rows),'mean_opponent_reward':statistics.mean(r['opp_reward'] for r in rows),'mean_margin':statistics.mean(r['margin'] for r in rows),'rows':rows}
          open('kaggriculture_meta_lab/results/v10-late-market-closed-loop-20260911.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps({k:{a:b for a,b in v.items() if a!='rows'} for k,v in out['opponents'].items()},indent=2))
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/v10-late-market-closed-loop-20260911.json
          git commit -m "Record adaptive late-market closed-loop panel"
          git push origin HEAD:arena/01a0712c-riemann
