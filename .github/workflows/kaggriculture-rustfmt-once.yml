name: Kaggriculture Rust format repair
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-rustfmt-once.yml"]
permissions: {contents: write}
jobs:
  format:
    if: contains(github.event.head_commit.message, '[kg-rustfmt]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@1.85.1
        with: {components: rustfmt}
      - run: cargo fmt --manifest-path kaggriculture_meta_lab/rust_port/Cargo.toml
      - run: |
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/rust_port/src/overlay.rs
          if git diff --cached --quiet;then exit 0;fi
          git commit -m 'Apply canonical Rust formatting';git pull --rebase origin arena/01a0712c-riemann;git push origin HEAD:arena/01a0712c-riemann
