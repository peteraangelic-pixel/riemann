name: Kaggriculture V13 broad TOP12 parent screen
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-v13-top12-parent-screen.yml"]
permissions: {contents: write}
jobs:
  screen:
    if: contains(github.event.head_commit.message, '[kg-v13-parents]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install --disable-pip-version-check py7zr
      - run: |
          python - <<'PY'
          import json,pathlib,py7zr
          with py7zr.SevenZipFile('TOP12.7z') as z:z.extractall('/tmp/top12')
          roots=[m.parent for m in pathlib.Path('/tmp/top12').rglob('manifest.json') if len(json.loads(m.read_text()).get('teams',[]))==12]
          assert len(roots)==1,roots;pathlib.Path('/tmp/root').write_text(str(roots[0]))
          PY
      - working-directory: kaggriculture_meta_lab/rust_port
        run: cargo build --release --locked
      - name: Screen all 108 replay policies on common fresh seeds
        run: |
          python kaggriculture_meta_lab/scripts/screen_top12_replay_population.py --corpus "$(cat /tmp/root)" \
            --template kaggriculture_meta_lab/agents/candidates/agent_v8_late401_official.py --seeds 2 --seed-start 180000 --workers 4 \
            --output kaggriculture_meta_lab/results/v13-top12-parent-screen-20260912.json
      - run: |
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/v13-top12-parent-screen-20260912.json
          git commit -m "Record V13 broad TOP12 parent screen"
          git pull --rebase origin arena/01a0712c-riemann
          git push origin HEAD:arena/01a0712c-riemann
