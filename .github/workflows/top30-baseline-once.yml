name: Current TOP30 B21 baseline once

on:
  push:
    branches: [arena/01a0712c-riemann]
    paths: [.github/workflows/top30-baseline-once.yml]

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Keep generated result on the Arena branch
        run: git checkout -B arena/01a0712c-riemann origin/arena/01a0712c-riemann
      - uses: dtolnay/rust-toolchain@1.85.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kaggriculture_meta_lab/rust_port
      - name: Extract audited archive
        run: |
          python -m pip install --disable-pip-version-check py7zr
          python - <<'PY'
          import os, py7zr
          target = os.path.join(os.environ['RUNNER_TEMP'], 'top30')
          with py7zr.SevenZipFile('TOP30.7z') as archive:
              archive.extractall(target)
          print(target)
          PY
      - name: Build parity-gated simulator
        working-directory: kaggriculture_meta_lab/rust_port
        run: cargo build --release --locked
      - name: Run bounded 300-game baseline
        run: |
          python kaggriculture_meta_lab/scripts/benchmark_top30.py \
            --corpus "$RUNNER_TEMP/top30/TOP30" \
            --candidate kaggriculture_meta_lab/agents/current/agent_v9_b21_s16.py \
            --workers 4 \
            --output kaggriculture_meta_lab/results/top30-b21-baseline-20260908.json
      - name: Commit immutable result to this branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/top30-b21-baseline-20260908.json
          git commit -m 'data(kaggriculture): record bounded current TOP30 B21 baseline'
          git push origin HEAD:arena/01a0712c-riemann
