name: seat087c0 Rust LAB (static H2H batches)

# Large static-tape H2H batches on the Rust kg_sim engine (~3500 games/s).
# Trigger: push to this branch touching lab_queue.json with [kg-lab] in the
# message (the sandbox token cannot dispatch workflows via API, so the queue
# file carries the batch spec). workflow_dispatch is also declared for manual
# runs from the GitHub UI.
# Results: results/rust_<tag>.json per queued job, committed back to this
# branch + uploaded as an artifact. Reactive agents (G2/G4) are NOT valid
# inputs here.
on:
  push:
    branches: ["arena/01a087c0-riemann"]
    paths: ["kaggriculture_meta_lab/seat_087c0/lab_queue.json"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Queue must contain a job with this tag (runs it only)'
        required: false
        default: ''

concurrency:
  group: seat087c0-rust-lab-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lab:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[kg-lab]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kaggriculture_meta_lab/rust_port
      - name: Build kg_sim
        working-directory: kaggriculture_meta_lab/rust_port
        run: cargo build --release --locked
      - name: Run queued LAB jobs
        env:
          LAB_TAG: ${{ inputs.tag }}
        run: python kaggriculture_meta_lab/seat_087c0/scripts/run_lab_queue.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: rust-lab-${{ github.sha }}
          path: kaggriculture_meta_lab/seat_087c0/results/rust_*.json
          retention-days: 30
      - name: Commit results back
        if: success()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin "${{ github.ref_name }}"
          git add kaggriculture_meta_lab/seat_087c0/results/rust_*.json
          git commit -m "Rust LAB results ${{ github.sha }}"
          git push origin HEAD:${{ github.ref_name }}
