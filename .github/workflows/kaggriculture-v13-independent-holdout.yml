name: Kaggriculture V13 independent holdouts
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-v13-independent-holdout.yml"]
permissions: {contents: write}
jobs:
  validate:
    if: contains(github.event.head_commit.message, '[kg-v13-holdout]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install --disable-pip-version-check py7zr
      - run: |
          python - <<'PY'
          import json,pathlib,py7zr
          for arc,dst,n in [('TOP12.7z','/tmp/current',12),('TOP7.7z','/tmp/previous',7)]:
           with py7zr.SevenZipFile(arc) as z:z.extractall(dst)
           roots=[m.parent for m in pathlib.Path(dst).rglob('manifest.json') if len(json.loads(m.read_text()).get('teams',[]))==n]
           assert len(roots)==1,(arc,roots);pathlib.Path(dst+'.root').write_text(str(roots[0]))
          PY
      - working-directory: kaggriculture_meta_lab/rust_port
        run: cargo build --release --locked
      - name: Current TOP12, 8 fresh seeds
        run: |
          python kaggriculture_meta_lab/scripts/benchmark_champions_top15_fresh.py --corpus "$(cat /tmp/current.root)" --seeds 8 --seed-start 181000 --workers 4 \
           --candidate v13=kaggriculture_meta_lab/agents/candidates/agent_v13_structural_baseline.py \
           --candidate g2=kaggriculture_meta_lab/agents/candidates/agent_v8_control_g2_open_loop.py \
           --candidate v2=kaggriculture_meta_lab/agents/variants/agent_v16_kanno_top7_champion.py \
           --candidate v7=kaggriculture_meta_lab/agents/candidates/agent_v7_market_probe.py \
           --candidate v8=kaggriculture_meta_lab/agents/candidates/agent_v8_late401_official.py \
           --output kaggriculture_meta_lab/results/v13-current-top12-holdout-20260912.json
      - name: Previous TOP7, 4 fresh seeds
        run: |
          python kaggriculture_meta_lab/scripts/benchmark_champions_top15_fresh.py --corpus "$(cat /tmp/previous.root)" --seeds 4 --seed-start 182000 --workers 4 \
           --candidate v13=kaggriculture_meta_lab/agents/candidates/agent_v13_structural_baseline.py \
           --candidate g2=kaggriculture_meta_lab/agents/candidates/agent_v8_control_g2_open_loop.py \
           --candidate v2=kaggriculture_meta_lab/agents/variants/agent_v16_kanno_top7_champion.py \
           --candidate v7=kaggriculture_meta_lab/agents/candidates/agent_v7_market_probe.py \
           --candidate v8=kaggriculture_meta_lab/agents/candidates/agent_v8_late401_official.py \
           --output kaggriculture_meta_lab/results/v13-previous-top7-holdout-20260912.json
      - run: |
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/v13-*-holdout-20260912.json;git commit -m 'Record V13 independent holdouts'
          git pull --rebase origin arena/01a0712c-riemann;git push origin HEAD:arena/01a0712c-riemann
