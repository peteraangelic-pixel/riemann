name: Kaggriculture V6 opening diagnosis
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-v6-diagnosis.yml"]
permissions:
  contents: write
jobs:
  diagnosis:
    if: contains(github.event.head_commit.message, '[kg-v6-diagnosis]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install --disable-pip-version-check py7zr
      - name: Extract TOP15 and TOP30
        run: |
          python - <<'PY'
          import os,pathlib,py7zr
          for name in ('top15','top30'):
           with py7zr.SevenZipFile(name.upper()+'.7z') as a:a.extractall('/tmp/'+name)
           ms=list(pathlib.Path('/tmp/'+name).rglob('manifest.json'))
           root=ms[0].parent if len(ms)==1 else pathlib.Path(os.path.commonpath([str(x.parent) for x in ms]))
           pathlib.Path('/tmp/'+name+'-root').write_text(str(root))
          PY
      - working-directory: kaggriculture_meta_lab/rust_port
        run: cargo build --release --locked
      - name: Matched TOP15 V6 diagnosis against champions and G2
        run: |
          python kaggriculture_meta_lab/scripts/benchmark_champions_top15_fresh.py \
            --corpus "$(cat /tmp/top15-root)" --workers 4 --seeds 8 \
            --candidate v16=kaggriculture_meta_lab/agents/variants/agent_v16_kanno_top7_champion.py \
            --candidate v3=kaggriculture_meta_lab/agents/candidates/agent_v3_coherent_replay.py \
            --candidate v4=kaggriculture_meta_lab/agents/candidates/peer_v4_german9_kanno_v3.py \
            --candidate v5=kaggriculture_meta_lab/agents/candidates/peer_v5_evolved.py \
            --candidate v6=kaggriculture_meta_lab/agents/candidates/agent_v6_safe_opening.py \
            --candidate g2=kaggriculture_meta_lab/agents/variants/agent_v10_subin_106845775.py \
            --output kaggriculture_meta_lab/results/v6-diagnosis-top15-fresh-20260910.json
      - name: V6 original-seed TOP30
        run: |
          python kaggriculture_meta_lab/scripts/benchmark_top30.py \
            --corpus "$(cat /tmp/top30-root)" \
            --candidate kaggriculture_meta_lab/agents/candidates/agent_v6_safe_opening.py \
            --max-rank 30 --workers 4 \
            --output kaggriculture_meta_lab/results/v6-top30-original-seeds-20260910.json
      - name: Persist complete results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/v6-diagnosis-top15-fresh-20260910.json \
            kaggriculture_meta_lab/results/v6-top30-original-seeds-20260910.json
          git commit -m "Record V6 opening diagnosis"
          git push origin HEAD:arena/01a0712c-riemann
