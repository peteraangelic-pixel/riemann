name: Kaggriculture peer branch audit

on:
  push:
    branches: ["arena/01a07c52-riemann"]
    paths:
      - ".github/workflows/kaggriculture-branch-review.yml"
      - "kaggriculture_meta_lab/branch_review/**"
      - "!kaggriculture_meta_lab/branch_review/REVIEW.md"
      - "!kaggriculture_meta_lab/branch_review/review-results.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[kg-branch-review]')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.85.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kaggriculture_meta_lab/rust_port
      - name: Fetch checksum-pinned source snapshot without switching branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python kaggriculture_meta_lab/branch_review/fetch_source.py --destination .cache/peer-port
      - name: Minimal dependencies for the authoritative game framework
        run: python -m pip install --quiet --disable-pip-version-check -r kaggriculture_meta_lab/rust_port/requirements-framework.txt
      - name: Verify both native cores and exercise both LAB adapters
        run: python kaggriculture_meta_lab/rust_port/tools/ci_run.py python kaggriculture_meta_lab/branch_review/compare_branch.py --source .cache/peer-port --jobs 256 --repeats 3
      - name: Publish full review report
        if: always()
        run: |
          if [ -f .cache/branch-review-results/review.json ]; then
            python kaggriculture_meta_lab/rust_port/tools/ci_run.py --report .cache/branch-review-results/review.json
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: peer-branch-review-${{ github.sha }}
          path: .cache/branch-review-results/review.json
          include-hidden-files: true
          retention-days: 7
