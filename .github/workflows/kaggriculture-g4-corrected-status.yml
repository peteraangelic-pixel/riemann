name: Kaggriculture corrected G4 final evaluation status
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-g4-corrected-status.yml"]
permissions:
  contents: write
jobs:
  status:
    if: contains(github.event.head_commit.message, '[kg-g4-corrected-status]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install --disable-pip-version-check kaggle
      - env: {KAGGLE_API_TOKEN: "${{ secrets.KAGGLE_API_TOKEN }}"}
        run: |
          mkdir -p ~/.kaggle
          printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]' > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
          kaggle competitions submissions -c kaggriculture --csv > kaggriculture_meta_lab/results/kaggle-g4-29-corrected-final.csv
          python - <<'PY'
          import csv,json
          rows=list(csv.DictReader(open('kaggriculture_meta_lab/results/kaggle-g4-29-corrected-final.csv')))
          row=next(x for x in rows if x['ref']=='56131785')
          json.dump(row,open('kaggriculture_meta_lab/results/kaggle-g4-29-corrected-evaluation-20260910.json','w'),indent=2)
          print(row)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/kaggle-g4-29-corrected-final.csv kaggriculture_meta_lab/results/kaggle-g4-29-corrected-evaluation-20260910.json
          git commit -m "Record corrected G4 evaluation status"
          git push origin HEAD:arena/01a0712c-riemann
