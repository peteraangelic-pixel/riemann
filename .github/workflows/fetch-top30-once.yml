name: Fetch TOP30 corpus once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download public OneDrive archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            --output TOP30.ZIP \
            'https://1drv.ms/u/c/d121e4090537c839/IQDZQgb_nHdjRr6rvWpcbapuAebsVwIFk1ey_tCFqXBOGtM?download=1'
          test "$(stat -c %s TOP30.ZIP)" -gt 1000000
          file TOP30.ZIP
          sha256sum TOP30.ZIP | tee TOP30.ZIP.sha256
          unzip -t TOP30.ZIP
      - name: Upload short-lived transfer artifact
        uses: actions/upload-artifact@v5
        with:
          name: top30-transfer
          path: |
            TOP30.ZIP
            TOP30.ZIP.sha256
          compression-level: 0
          retention-days: 1
