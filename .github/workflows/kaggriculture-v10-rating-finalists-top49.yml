name: Kaggriculture V10 rating finalists TOP49
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-v10-rating-finalists-top49.yml"]
permissions:
  contents: write
jobs:
  validate:
    if: contains(github.event.head_commit.message, '[kaggr-v10-rating-top49]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 28
      matrix:
        agent: [control_b21s16, b18s13, b19s14, b20s15]
        shard: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install kaggle-environments==1.32.7
      - name: Same-record both-seat TOP49 evaluation
        env: {AGENT: "${{ matrix.agent }}", SHARD: "${{ matrix.shard }}"}
        run: |
          case "$AGENT" in
            control_b21s16) path=kaggriculture/v9_candidates/v7_opening_grid/agent_v9_v7w_b21_s16.py ;;
            b18s13) path=kaggriculture/v10_candidates/opening_rating/agent_v10_b18_s13.py ;;
            b19s14) path=kaggriculture/v10_candidates/opening_rating/agent_v10_b19_s14.py ;;
            b20s15) path=kaggriculture/v10_candidates/opening_rating/agent_v10_b20_s15.py ;;
            *) exit 2 ;;
          esac
          set -o pipefail
          python kaggriculture/research/screen_top49_all.py --agent "$path" --shard "$SHARD" | tee /tmp/out
          mkdir result
          grep '^SHARD_JSON=' /tmp/out | sed 's/^SHARD_JSON=//' > result/result.json
      - uses: actions/upload-artifact@v4
        with: {name: "result-${{ matrix.agent }}-${{ matrix.shard }}", path: result/result.json}
  aggregate:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with: {pattern: "result-*", path: results}
      - name: Persist summaries and episode rows
        run: |
          python - <<'PY'
          import collections,glob,json,os
          grouped=collections.defaultdict(list)
          for p in glob.glob('results/**/*.json',recursive=True):
              agent=os.path.basename(os.path.dirname(p)).removeprefix('result-').rsplit('-',1)[0]
              grouped[agent].append(json.load(open(p,encoding='utf8')))
          summaries=[]; detail={}
          for agent,parts in grouped.items():
              n=sum(x['episodes'] for x in parts)
              avg=lambda key:sum(x[key]*x['episodes'] for x in parts)/n
              summaries.append({'agent':agent,'shards':len(parts),'episodes':n,
                  'games':sum(x['games'] for x in parts),'wins':sum(x['wins'] for x in parts),
                  'our_mean':avg('our_mean'),'opponent_mean':avg('opponent_mean'),
                  'margin_mean':avg('margin_mean')})
              detail[agent]=[row for part in parts for row in part['rows']]
          summaries.sort(key=lambda x:(x['wins'],x['margin_mean']),reverse=True)
          assert len(summaries)==4 and all(x['episodes']==245 and x['games']==490 and x['shards']==7 for x in summaries)
          payload={'dataset':{'player_tape_records':245,'both_seats':True},'summaries':summaries,'rows':detail}
          out='kaggriculture/research/V10_B21_RATING_FINALISTS_TOP49.json'
          json.dump(payload,open(out,'w',encoding='utf8'),ensure_ascii=False,indent=2)
          lines=['# V10 B21 rating finalists — TOP49 both seats','',
                 '| Agent | Wins / 490 | Mean score | Mean opponent | Mean margin |',
                 '|---|---:|---:|---:|---:|']
          for x in summaries:
              lines.append(f"| {x['agent']} | {x['wins']} | {x['our_mean']:,.0f} | {x['opponent_mean']:,.0f} | {x['margin_mean']:+,.0f} |")
          lines += ['', 'Same 245 player-tape records and both seats for every policy. Episode rows are retained in the JSON for loss-family attribution.']
          open('kaggriculture/research/V10_B21_RATING_FINALISTS_TOP49.md','w',encoding='utf8').write('\n'.join(lines)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kaggriculture/research/V10_B21_RATING_FINALISTS_TOP49.json kaggriculture/research/V10_B21_RATING_FINALISTS_TOP49.md
          git commit -m "research(kaggriculture): record V10 rating finalists TOP49 [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
