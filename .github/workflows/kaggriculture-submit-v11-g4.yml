name: Kaggriculture submit explicitly requested G4-29
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-submit-v11-g4.yml"]
permissions:
  contents: read
jobs:
  submit:
    if: contains(github.event.head_commit.message, '[kaggr-submit-v11-g4]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Validate standalone agent
        run: |
          python -m py_compile kaggriculture_meta_lab/agents/variants/agent_v11_subin_g4_29.py
          test $(wc -c < kaggriculture_meta_lab/agents/variants/agent_v11_subin_g4_29.py) -lt 25000
      - name: Configure Kaggle token
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p ~/.kaggle
          clean_token=$(printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]')
          test -n "$clean_token"
          printf '%s' "$clean_token" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
      - run: pip install --disable-pip-version-check kaggle
      - name: Package and upload explicitly requested G4-29
        run: |
          work=$(mktemp -d)
          cp kaggriculture_meta_lab/agents/variants/agent_v11_subin_g4_29.py "$work/main.py"
          tar -C "$work" -czf "$work/submission-v11-subin-g4-29.tar.gz" main.py
          kaggle competitions submit -c kaggriculture \
            -f "$work/submission-v11-subin-g4-29.tar.gz" \
            -m "V11 G4-29 TOP5 18-18 TOP10 27-39 TOP15 29-83 closed8-24 explicitly requested $GITHUB_SHA"
