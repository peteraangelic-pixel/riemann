name: Kaggriculture V9 V7-opening TOP49 grid
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths:
      - "kaggriculture/v9_candidates/v7_opening_grid/**"
      - "kaggriculture/research/build_v7_opening_grid.py"
      - ".github/workflows/kaggriculture-v9-v7-opening-grid.yml"
permissions:
  contents: write
jobs:
  screen:
    if: contains(github.event.head_commit.message, '[kaggr-v9-v7grid]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 21
      matrix:
        agent:
          - agent_v9_v7w_b09_s06
          - agent_v9_v7w_b09_s04
          - agent_v9_v7w_b09_s02
          - agent_v9_v7w_b13_s10
          - agent_v9_v7w_b13_s08
          - agent_v9_v7w_b13_s06
          - agent_v9_v7w_b17_s14
          - agent_v9_v7w_b17_s12
          - agent_v9_v7w_b17_s10
          - agent_v9_v7w_b21_s18
          - agent_v9_v7w_b21_s16
          - agent_v9_v7w_b21_s14
          - agent_v9_v7w_b25_s22
          - agent_v9_v7w_b25_s20
          - agent_v9_v7w_b25_s18
          - agent_v9_v7w_b30_s27
          - agent_v9_v7w_b30_s25
          - agent_v9_v7w_b30_s23
          - agent_v9_v7w_b35_s32
          - agent_v9_v7w_b35_s30
          - agent_v9_v7w_b35_s28
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install kaggle-environments
      - name: Screen isolated V7 opening
        env: {AGENT: "${{ matrix.agent }}"}
        run: |
          set -o pipefail
          : > /tmp/all.txt
          for shard in 0 1 2 3 4 5 6; do
            python kaggriculture/research/screen_top49.py --agent "kaggriculture/v9_candidates/v7_opening_grid/$AGENT.py" --shard "$shard" --shards 7 >> /tmp/all.txt
          done
          mkdir result
          python - <<'PY'
          import json,os
          rows=[json.loads(x[12:]) for x in open('/tmp/all.txt',encoding='utf8') if x.startswith('PLAYER_JSON=')]
          out={'agent':os.environ['AGENT'],'players':len(rows),'games':sum(x['games'] for x in rows),'wins':sum(x['wins'] for x in rows),'our_mean':sum(x['our_mean'] for x in rows)/len(rows),'opponent_mean':sum(x['opponent_mean'] for x in rows)/len(rows),'margin_mean':sum(x['margin_mean'] for x in rows)/len(rows)}
          json.dump(out,open('result/result.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with: {name: "result-${{ matrix.agent }}", path: result/result.json}
  aggregate:
    needs: screen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with: {pattern: "result-*", path: results}
      - run: |
          python - <<'PY'
          import glob,json
          rows=[json.load(open(p)) for p in glob.glob('results/**/*.json',recursive=True)]
          rows.sort(key=lambda x:(x['wins'],x['margin_mean']),reverse=True)
          assert len(rows)==21
          json.dump(rows,open('kaggriculture/research/V9_V7_OPENING_GRID_RESULTS.json','w'),indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kaggriculture/research/V9_V7_OPENING_GRID_RESULTS.json
          git commit -m "research(kaggriculture): record V7 opening grid [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
