name: Kaggriculture FarmOS v12 cross-branch audit
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-farmosa-v12-audit.yml"]
permissions:
  contents: write
jobs:
  holdout:
    if: contains(github.event.head_commit.message, '[kg-farmosa-v12-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install --disable-pip-version-check kaggle-environments==1.32.7
      - name: Run pinned-framework both-seat controls
        env:
          PYTHONPATH: kaggriculture_meta_lab
        run: |
          python -m py_compile kaggriculture_meta_lab/agents/variants/agent_farmosa_v12_087c0.py
          rc=0
          python kaggriculture_meta_lab/scripts/validate_current.py \
            --candidate agents/variants/agent_farmosa_v12_087c0.py \
            --control agents/current/agent_v9_b21_s16.py \
            --control agents/variants/agent_v10_subin_106845775.py \
            --control agents/variants/agent_v11_subin_g4_29.py \
            --games 16 --workers 4 --start-seed 20260960 || rc=$?
          result=$(ls -t kaggriculture_meta_lab/results/validate-current-*.json | head -1)
          cp "$result" kaggriculture_meta_lab/results/farmosa-v12-cross-branch-holdout-20260910.json
          python - <<'PY'
          import json
          p='kaggriculture_meta_lab/results/farmosa-v12-cross-branch-holdout-20260910.json'
          d=json.load(open(p)); assert all(row['errors']==0 for row in d['controls']), d
          PY
          exit "$rc"
      - name: Persist fail-closed holdout
        if: always()
        run: |
          test -f kaggriculture_meta_lab/results/farmosa-v12-cross-branch-holdout-20260910.json || exit 1
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/farmosa-v12-cross-branch-holdout-20260910.json
          git commit -m "Record FarmOS v12 cross-branch holdout"
          git push origin HEAD:arena/01a0712c-riemann
