name: Kaggriculture submission status diagnostic
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-submission-status.yml"]
permissions:
  contents: write
jobs:
  status:
    if: contains(github.event.head_commit.message, '[kg-submission-status]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Configure Kaggle token
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p ~/.kaggle
          clean_token=$(printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]')
          test -n "$clean_token" || { echo '::error::KAGGLE_API_TOKEN is missing'; exit 1; }
          printf '%s' "$clean_token" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
      - run: pip install --disable-pip-version-check kaggle
      - name: Read and persist submission status
        run: |
          kaggle competitions submissions kaggriculture -v | head -20 | tee kaggriculture_meta_lab/results/kaggle-submission-status-20260909.txt
          python - <<'PY' | tee kaggriculture_meta_lab/results/kaggle-submission-56130004.json
          import json
          from kaggle.api.kaggle_api_extended import KaggleApi
          api = KaggleApi(); api.authenticate()
          match = next(item for item in api.competition_submissions('kaggriculture')
                       if int(item.ref) == 56130004)
          payload = match.to_dict() if hasattr(match, 'to_dict') else vars(match)
          print(json.dumps(payload, default=str, indent=2, sort_keys=True))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/kaggle-submission-status-20260909.txt kaggriculture_meta_lab/results/kaggle-submission-56130004.json
          git commit -m "Record Kaggle submission status diagnostic"
          git push origin HEAD:arena/01a0712c-riemann
