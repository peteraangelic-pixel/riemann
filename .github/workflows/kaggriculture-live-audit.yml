name: Kaggriculture read-only live audit

on:
  push:
    branches: ["arena/01a07c52-riemann"]
    paths:
      - ".github/workflows/kaggriculture-live-audit.yml"
      - "kaggriculture_meta_lab/research/live_status.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[kg-live-audit]')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install read-only API client
        run: python -m pip install --quiet --disable-pip-version-check kaggle==2.2.4
      - name: Read public leaderboard and public submission scores (no uploads)
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python kaggriculture_meta_lab/research/live_status.py
