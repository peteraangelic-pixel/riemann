name: Kaggriculture timed V3 0205 and V7 0800 Warsaw
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-delayed-submit-v3-v7.yml"]
permissions: {contents: write}
jobs:
  submit-v3:
    if: contains(github.event.head_commit.message, '[kg-timed-v3-v7]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Wait until 2026-09-11 00:05 UTC (02:05 Warsaw)
        run: |
          target=$(date -u -d '2026-09-11 00:05:00 UTC' +%s); now=$(date -u +%s); delay=$((target-now))
          if [ "$delay" -gt 0 ]; then echo "Waiting ${delay}s"; sleep "$delay"; fi
          echo "V3 submission time: $(date -u --iso-8601=seconds)"
      - run: pip install --disable-pip-version-check kaggle
      - name: Submit V3 and persist exact response
        env: {KAGGLE_API_TOKEN: "${{ secrets.KAGGLE_API_TOKEN }}"}
        run: |
          mkdir -p ~/.kaggle /tmp/v3 kaggriculture_meta_lab/results
          printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]' > ~/.kaggle/access_token; chmod 600 ~/.kaggle/access_token
          cp kaggriculture_meta_lab/agents/candidates/agent_v3_coherent_replay.py /tmp/v3/main.py
          python -m py_compile /tmp/v3/main.py; tar -C /tmp/v3 -czf /tmp/v3.tar.gz main.py; test $(wc -c </tmp/v3.tar.gz) -lt 100000000
          set +e
          kaggle competitions submit -c kaggriculture -f /tmp/v3.tar.gz -m "V3 coherent replay UTC reset evaluation $GITHUB_SHA" >/tmp/out 2>&1; code=$?
          sleep 5; kaggle competitions submissions -c kaggriculture --csv >/tmp/list.csv 2>/tmp/list.err; list_code=$?
          set -e
          CODE="$code" LIST_CODE="$list_code" python - <<'PY'
          import csv,json,os,pathlib
          rows=list(csv.DictReader(open('/tmp/list.csv'))) if os.environ['LIST_CODE']=='0' else []
          prefix='V3 coherent replay UTC reset evaluation'
          out={'target_utc':'2026-09-11T00:05:00Z','exit_code':int(os.environ['CODE']),'output':pathlib.Path('/tmp/out').read_text(),'list_exit_code':int(os.environ['LIST_CODE']),'list_error':pathlib.Path('/tmp/list.err').read_text(),'accepted_submission':next((r for r in rows if prefix in r.get('description','')),None)}
          pathlib.Path('kaggriculture_meta_lab/results/kaggle-v3-timed-submit-20260911.json').write_text(json.dumps(out,indent=2)+'\n');print(json.dumps(out,indent=2))
          PY
      - name: Save V3 result
        run: |
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/kaggle-v3-timed-submit-20260911.json
          git commit -m "Record timed V3 submission"; git pull --rebase origin arena/01a0712c-riemann; git push origin HEAD:arena/01a0712c-riemann

  submit-v7:
    needs: submit-v3
    if: always() && needs.submit-v3.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Wait until 2026-09-11 06:00 UTC (08:00 Warsaw)
        run: |
          target=$(date -u -d '2026-09-11 06:00:00 UTC' +%s); now=$(date -u +%s); delay=$((target-now))
          if [ "$delay" -gt 0 ]; then echo "Waiting ${delay}s"; sleep "$delay"; fi
          echo "V7 submission time: $(date -u --iso-8601=seconds)"
      - run: pip install --disable-pip-version-check kaggle
      - name: Submit V7 and persist exact response
        env: {KAGGLE_API_TOKEN: "${{ secrets.KAGGLE_API_TOKEN }}"}
        run: |
          mkdir -p ~/.kaggle /tmp/v7 kaggriculture_meta_lab/results
          printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]' > ~/.kaggle/access_token; chmod 600 ~/.kaggle/access_token
          cp kaggriculture_meta_lab/agents/candidates/agent_v7_market_probe.py /tmp/v7/main.py
          python -m py_compile /tmp/v7/main.py; tar -C /tmp/v7 -czf /tmp/v7.tar.gz main.py; test $(wc -c </tmp/v7.tar.gz) -lt 100000000
          set +e
          kaggle competitions submit -c kaggriculture -f /tmp/v7.tar.gz -m "V7 market probe morning control $GITHUB_SHA" >/tmp/out 2>&1; code=$?
          sleep 5; kaggle competitions submissions -c kaggriculture --csv >/tmp/list.csv 2>/tmp/list.err; list_code=$?
          set -e
          CODE="$code" LIST_CODE="$list_code" python - <<'PY'
          import csv,json,os,pathlib
          rows=list(csv.DictReader(open('/tmp/list.csv'))) if os.environ['LIST_CODE']=='0' else []
          prefix='V7 market probe morning control'
          out={'target_utc':'2026-09-11T06:00:00Z','exit_code':int(os.environ['CODE']),'output':pathlib.Path('/tmp/out').read_text(),'list_exit_code':int(os.environ['LIST_CODE']),'list_error':pathlib.Path('/tmp/list.err').read_text(),'accepted_submission':next((r for r in rows if prefix in r.get('description','')),None)}
          pathlib.Path('kaggriculture_meta_lab/results/kaggle-v7-timed-submit-20260911.json').write_text(json.dumps(out,indent=2)+'\n');print(json.dumps(out,indent=2))
          PY
      - name: Save V7 result
        run: |
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/kaggle-v7-timed-submit-20260911.json
          git commit -m "Record timed V7 submission"; git pull --rebase origin arena/01a0712c-riemann; git push origin HEAD:arena/01a0712c-riemann
