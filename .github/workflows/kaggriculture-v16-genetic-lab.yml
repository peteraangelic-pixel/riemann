name: Kaggriculture V16 iterative genetic LAB
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-v16-genetic-lab.yml"]
permissions:
  contents: write
jobs:
  search:
    if: contains(github.event.head_commit.message, '[kg-v16-genetic-lab]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: kaggriculture_meta_lab/rust_port
        run: cargo build --release --locked
      - name: Four evolutionary iterations plus independent holdout
        run: |
          python kaggriculture_meta_lab/scripts/search_v16_genetic_blocks.py \
            --binary kaggriculture_meta_lab/rust_port/target/release/kg_sim \
            --population 384 --generations 4 --threads 4 \
            --output kaggriculture_meta_lab/results/v16-genetic-block-lab-20260910.json \
            --agent-output kaggriculture_meta_lab/agents/candidates/v16_genetic_block_holdout_winner.py
      - name: Persist complete evidence and optional winner
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/v16-genetic-block-lab-20260910.json
          if test -f kaggriculture_meta_lab/agents/candidates/v16_genetic_block_holdout_winner.py; then
            python -m py_compile kaggriculture_meta_lab/agents/candidates/v16_genetic_block_holdout_winner.py
            git add kaggriculture_meta_lab/agents/candidates/v16_genetic_block_holdout_winner.py
          fi
          git commit -m "Record iterative V16 genetic LAB"
          git push origin HEAD:arena/01a0712c-riemann
