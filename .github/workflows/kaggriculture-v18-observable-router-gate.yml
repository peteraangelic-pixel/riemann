name: V18 observable V8-V16 router gate
on:
  push:
    branches: ["arena/01a087c0-riemann"]
    paths: [".github/workflows/kaggriculture-v18-observable-router-gate.yml"]
permissions: {contents: write}
jobs:
  gate:
    if: contains(github.event.head_commit.message, '[kg-v18-router]')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install --disable-pip-version-check py7zr kaggle-environments==1.32.7
      - name: Extract exact newest TOP12
        run: |
          test "$(git rev-parse HEAD:TOP12.7z)" = 966c612018cd7ca7b3e124e319968687a86f73c4
          python - <<'PY'
          import json,pathlib,py7zr
          with py7zr.SevenZipFile('TOP12.7z') as z:z.extractall('/tmp/newest')
          roots=[m.parent for m in pathlib.Path('/tmp/newest').rglob('manifest.json') if len(json.loads(m.read_text()).get('teams',[]))==12]
          assert len(roots)==1;pathlib.Path('/tmp/root').write_text(str(roots[0]))
          PY
      - name: Independent targeted closed-loop gate
        run: |
          python kaggriculture_meta_lab/seat_087c0/scripts/gate_v18_observable_routers.py --corpus "$(cat /tmp/root)" --seed 198000 \
            --candidate v8=kaggriculture_meta_lab/seat_087c0/agents/champion_tape_v8.py \
            --candidate safe=kaggriculture_meta_lab/seat_087c0/candidates/agent_v18_router_wheat_safe.py \
            --candidate broad=kaggriculture_meta_lab/seat_087c0/candidates/agent_v18_router_milk_broad.py \
            --candidate dual=kaggriculture_meta_lab/seat_087c0/candidates/agent_v18_router_dual_guard.py \
            --output kaggriculture_meta_lab/seat_087c0/results/v18-observable-router-targeted-gate.json
      - name: Persist
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/seat_087c0/results/v18-observable-router-targeted-gate.json
          git commit -m "Record V18 observable router targeted gate"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:${{ github.ref_name }}
