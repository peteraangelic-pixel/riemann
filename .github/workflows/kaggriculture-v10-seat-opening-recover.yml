name: Recover V10 seat-opening TOP49 artifacts
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-v10-seat-opening-recover.yml"]
permissions:
  actions: read
  contents: write
jobs:
  recover:
    if: contains(github.event.head_commit.message, '[kaggr-v10-seat-recover]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results
          github-token: "${{ github.token }}"
          repository: peteraangelic-pixel/riemann
          run-id: 34144645075
      - name: Aggregate and persist
        run: |
          find results -type f -print
          python - <<'PY'
          import collections,glob,json,os
          grouped=collections.defaultdict(list)
          for p in glob.glob('results/**/*.json',recursive=True):
              directory=os.path.basename(os.path.dirname(p))
              agent=directory.removeprefix('result-').rsplit('-',1)[0]
              grouped[agent].append(json.load(open(p,encoding='utf8')))
          print({k:len(v) for k,v in grouped.items()})
          summaries=[]; rows={}
          for agent,parts in grouped.items():
              n=sum(x['episodes'] for x in parts); avg=lambda k:sum(x[k]*x['episodes'] for x in parts)/n
              summaries.append({'agent':agent,'shards':len(parts),'episodes':n,'games':sum(x['games'] for x in parts),
                  'wins':sum(x['wins'] for x in parts),'our_mean':avg('our_mean'),
                  'opponent_mean':avg('opponent_mean'),'margin_mean':avg('margin_mean')})
              rows[agent]=[r for part in parts for r in part['rows']]
          summaries.sort(key=lambda x:(x['wins'],x['margin_mean']),reverse=True)
          assert len(summaries)==4 and all(x['episodes']==245 and x['games']==490 and x['shards']==7 for x in summaries), summaries
          out={'source_run':34144645075,'dataset':{'player_tape_records':245,'both_seats':True},'summaries':summaries,'rows':rows}
          json.dump(out,open('kaggriculture/research/V10_B21_SEAT_OPENING_TOP49.json','w',encoding='utf8'),ensure_ascii=False,indent=2)
          lines=['# V10 B21 seat-specific B20/S15 — TOP49','',
                 '| Agent | Wins / 490 | Mean score | Mean opponent | Mean margin |','|---|---:|---:|---:|---:|']
          for x in summaries: lines.append(f"| {x['agent']} | {x['wins']} | {x['our_mean']:,.0f} | {x['opponent_mean']:,.0f} | {x['margin_mean']:+,.0f} |")
          lines += ['', 'Same 245 player-tape records and both seats. Full rows retained for seat/loss attribution.']
          open('kaggriculture/research/V10_B21_SEAT_OPENING_TOP49.md','w',encoding='utf8').write('\n'.join(lines)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+arena-agent@users.noreply.github.com"
          git add kaggriculture/research/V10_B21_SEAT_OPENING_TOP49.*
          git commit -m "research(kaggriculture): recover V10 seat-opening TOP49 [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
