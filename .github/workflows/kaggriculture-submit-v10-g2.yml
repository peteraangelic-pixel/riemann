name: Kaggriculture submit V10 Subin G2-83
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-submit-v10-g2.yml"]
permissions:
  contents: read
jobs:
  submit:
    if: contains(github.event.head_commit.message, '[kaggr-submit-v10-g2]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Compile explicitly approved standalone G2 agent
        run: python -m py_compile kaggriculture_meta_lab/agents/variants/agent_v10_subin_g2_83.py
      - name: Configure Kaggle token
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p ~/.kaggle
          clean_token=$(printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]')
          test -n "$clean_token" || { echo '::error::KAGGLE_API_TOKEN is missing'; exit 1; }
          printf '%s' "$clean_token" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
      - run: pip install --disable-pip-version-check kaggle
      - name: Package and upload explicitly approved G2-83
        run: |
          work=$(mktemp -d)
          cp kaggriculture_meta_lab/agents/variants/agent_v10_subin_g2_83.py "$work/main.py"
          tar -C "$work" -czf "$work/submission-v10-subin-g2-83.tar.gz" main.py
          output=$(kaggle competitions submit -c kaggriculture \
            -f "$work/submission-v10-subin-g2-83.tar.gz" \
            -m "V10 Subin G2-83 cash250 milk1 TOP30 margin672 closed23of32 $GITHUB_SHA" 2>&1)
          printf '%s\n' "$output"
          safe=$(printf '%s' "$output" | sed -E 's/KGAT_[A-Za-z0-9_-]+/[REDACTED]/g')
          safe=${safe//'%'/'%25'}; safe=${safe//$'\n'/'%0A'}; safe=${safe//$'\r'/'%0D'}
          echo "::notice title=V10 G2-83 Kaggle upload::$safe"
          kaggle competitions submissions kaggriculture | head -10
