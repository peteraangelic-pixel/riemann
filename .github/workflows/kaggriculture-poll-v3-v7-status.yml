name: Kaggriculture poll V3 and V7 live status
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-poll-v3-v7-status.yml"]
permissions: {contents: write}
jobs:
  poll:
    if: contains(github.event.head_commit.message, '[kg-poll-v3-v7]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install --disable-pip-version-check kaggle
      - env: {KAGGLE_API_TOKEN: "${{ secrets.KAGGLE_API_TOKEN }}"}
        run: |
          mkdir -p ~/.kaggle;printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]' > ~/.kaggle/access_token;chmod 600 ~/.kaggle/access_token
          kaggle competitions submissions -c kaggriculture --csv > /tmp/submissions.csv
          python - <<'PY'
          import csv,json,pathlib
          rows=list(csv.DictReader(open('/tmp/submissions.csv')))
          out={}
          for ref,label in [('56154098','v3'),('56159653','v7')]:
           row=next(r for r in rows if r.get('ref')==ref);out[label]=row;print(label,row)
          pathlib.Path('kaggriculture_meta_lab/results/kaggle-v3-v7-stabilized-20260912.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - run: |
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/kaggle-v3-v7-stabilized-20260912.json;git commit -m 'Record stabilized V3 and V7 Kaggle scores'
          git pull --rebase origin arena/01a0712c-riemann;git push origin HEAD:arena/01a0712c-riemann
