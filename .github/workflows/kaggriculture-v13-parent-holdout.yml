name: Kaggriculture V13 parent survivor holdout
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-v13-parent-holdout.yml"]
permissions: {contents: write}
jobs:
  holdout:
    if: contains(github.event.head_commit.message, '[kg-v13-survivors]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install --disable-pip-version-check py7zr
      - run: |
          python - <<'PY'
          import json,pathlib,py7zr
          with py7zr.SevenZipFile('TOP12.7z') as z:z.extractall('/tmp/c')
          roots=[m.parent for m in pathlib.Path('/tmp/c').rglob('manifest.json') if len(json.loads(m.read_text()).get('teams',[]))==12]
          assert len(roots)==1;pathlib.Path('/tmp/root').write_text(str(roots[0]))
          PY
      - working-directory: kaggriculture_meta_lab/rust_port
        run: cargo build --release --locked
      - name: Independent 8-seed survivor holdout
        run: |
          args=(); for f in kaggriculture_meta_lab/agents/v13_parents/*.py; do n=$(basename "$f" .py); args+=(--candidate "$n=$f"); done
          args+=(--candidate v8=kaggriculture_meta_lab/agents/candidates/agent_v8_late401_official.py)
          python kaggriculture_meta_lab/scripts/benchmark_champions_top15_fresh.py --corpus "$(cat /tmp/root)" --seeds 8 --seed-start 183000 --workers 4 "${args[@]}" \
           --output kaggriculture_meta_lab/results/v13-parent-survivor-holdout-20260912.json
      - run: |
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/v13-parent-survivor-holdout-20260912.json;git commit -m 'Record V13 parent survivor holdout'
          git pull --rebase origin arena/01a0712c-riemann;git push origin HEAD:arena/01a0712c-riemann
