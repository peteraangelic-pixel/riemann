name: Kaggriculture V16 current animal crossover search
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-v16-current-animal-crossovers.yml"]
permissions: {contents: write}
jobs:
  search:
    if: contains(github.event.head_commit.message, '[kg-v16-cross]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install --disable-pip-version-check py7zr
      - run: |
          python - <<'PY'
          import json,pathlib,py7zr
          with py7zr.SevenZipFile('TOP12.7z') as z:z.extractall('/tmp/c')
          roots=[m.parent for m in pathlib.Path('/tmp/c').rglob('manifest.json') if len(json.loads(m.read_text()).get('teams',[]))==12]
          assert len(roots)==1;pathlib.Path('/tmp/root').write_text(str(roots[0]))
          PY
      - working-directory: kaggriculture_meta_lab/rust_port
        run: cargo build --release --locked
      - run: |
          python kaggriculture_meta_lab/scripts/search_v16_current_animal_crossovers.py --corpus "$(cat /tmp/root)" \
           --binary kaggriculture_meta_lab/rust_port/target/release/kg_sim --population 128 --threads 4 \
           --output kaggriculture_meta_lab/results/v16-current-animal-crossovers-20260912.json \
           --agent-output kaggriculture_meta_lab/agents/candidates/agent_v16_current_animal_crossover.py
      - run: |
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/v16-current-animal-crossovers-20260912.json kaggriculture_meta_lab/agents/candidates/agent_v16_current_animal_crossover.py
          git commit -m 'Record V16 current animal crossover search';git pull --rebase origin arena/01a0712c-riemann;git push origin HEAD:arena/01a0712c-riemann
