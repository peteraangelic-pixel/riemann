name: Kaggriculture Rust simulator

on:
  push:
    branches: ["arena/**"]
    paths:
      - "kaggriculture_meta_lab/rust_port/**"
      - "!kaggriculture_meta_lab/rust_port/VALIDATION.md"
      - "kaggriculture_meta_lab/kaggriculture_lab/rust_backend.py"
      - "kaggriculture_meta_lab/scripts/check_rust_lab_parity.py"
      - ".github/workflows/kaggriculture-rust.yml"
  pull_request:
    paths:
      - "kaggriculture_meta_lab/rust_port/**"
      - "!kaggriculture_meta_lab/rust_port/VALIDATION.md"
      - "kaggriculture_meta_lab/kaggriculture_lab/rust_backend.py"
      - "kaggriculture_meta_lab/scripts/check_rust_lab_parity.py"
      - ".github/workflows/kaggriculture-rust.yml"
  workflow_dispatch:
    inputs:
      verify_upstream:
        description: "Also download the pinned wheel and test against the actual Kaggle framework"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulator:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kaggriculture_meta_lab/rust_port
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kaggriculture_meta_lab/rust_port
      - name: Locked dependencies
        run: cargo fetch --locked
      - name: Format diagnostics
        run: python tools/ci_run.py --format
      - name: Clippy
        id: clippy
        continue-on-error: true
        run: python tools/ci_run.py cargo clippy --all-targets --locked -- -D warnings
      - name: Rust debug tests (CPython, hand modes, zero allocation)
        id: rust_tests
        continue-on-error: true
        run: python tools/ci_run.py cargo test --locked
      - name: Rust release tests (including the allocation counter)
        id: release_tests
        continue-on-error: true
        run: python tools/ci_run.py cargo test --release --locked
      - name: Release binary
        run: python tools/ci_run.py cargo build --release --locked
      - name: Python adapter, protocol and CLI tests
        run: |
          test -x target/release/kg_sim
          python tools/ci_run.py python -m unittest discover -s tests -v
      - name: Actual Kaggle framework smoke test (opt-in network check)
        if: inputs.verify_upstream || contains(github.event.head_commit.message, '[kg-upstream]')
        run: |
          python -m pip install --disable-pip-version-check -r requirements-framework.txt
          python tools/ci_run.py python tools/check_framework.py --download
          python tools/ci_run.py --report work/framework-report.json
      - name: Differential tests against the pinned Python engine
        run: |
          python tools/ci_run.py python tools/check.py --check --seeds 64 --threads 4
          python tools/ci_run.py --report work/check-report.json
      - name: Integrated LAB parity on static and raw-replay jobs
        if: contains(github.event.head_commit.message, '[kg-lab-parity]')
        run: |
          python -m pip install --disable-pip-version-check kaggle-environments==1.32.7
          set -o pipefail
          python ../scripts/check_rust_lab_parity.py | tee work/lab-parity.txt
      - name: Small end-to-end benchmark (informational)
        run: |
          python tools/ci_run.py python tools/benchmark.py --games 64 --threads 4 --repeats 3
          python tools/ci_run.py --report work/benchmark.json
      - name: 14k-game batch, thread determinism and independent Python samples
        run: |
          python tools/ci_run.py python tools/benchmark_batch.py --games 14000 --threads 1,4,16 --repeats 3 --python-checks 64
          python tools/ci_run.py --report work/batch-benchmark.json
      - name: Enforce all checks and tracked formatting
        env:
          CLIPPY_RESULT: ${{ steps.clippy.outcome }}
          RUST_TEST_RESULT: ${{ steps.rust_tests.outcome }}
          RELEASE_TEST_RESULT: ${{ steps.release_tests.outcome }}
        run: |
          test "$CLIPPY_RESULT" = success
          test "$RUST_TEST_RESULT" = success
          test "$RELEASE_TEST_RESULT" = success
          git diff --exit-code -- '*.rs'
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: kg-sim-${{ github.sha }}
          path: |
            kaggriculture_meta_lab/rust_port/target/release/kg_sim
            kaggriculture_meta_lab/rust_port/work/check-report.json
            kaggriculture_meta_lab/rust_port/work/benchmark.json
            kaggriculture_meta_lab/rust_port/work/batch-benchmark.json
            kaggriculture_meta_lab/rust_port/work/framework-report.json
            kaggriculture_meta_lab/rust_port/work/lab-parity.txt
          retention-days: 7
