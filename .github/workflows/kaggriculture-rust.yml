name: Kaggriculture Rust simulator

on:
  push:
    branches: ["arena/**"]
    paths:
      - "kaggriculture_meta_lab/rust_port/**"
      - ".github/workflows/kaggriculture-rust.yml"
  pull_request:
    paths:
      - "kaggriculture_meta_lab/rust_port/**"
      - ".github/workflows/kaggriculture-rust.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kaggriculture_meta_lab/rust_port
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kaggriculture_meta_lab/rust_port
      - name: Dependencies and reproducible lockfile
        run: |
          if [ -f Cargo.lock ]; then cargo fetch --locked; else cargo fetch; fi
          python tools/ci_run.py --lockfile
      - name: Format diagnostics
        run: python tools/ci_run.py --format
      - name: Clippy
        id: clippy
        continue-on-error: true
        run: python tools/ci_run.py cargo clippy --all-targets --locked -- -D warnings
      - name: Rust tests (including zero-allocation and CPython fingerprints)
        id: rust_tests
        continue-on-error: true
        run: python tools/ci_run.py cargo test --locked
      - name: Release binary
        run: python tools/ci_run.py cargo build --release --locked
      - name: Python adapter and CLI tests
        run: |
          test -x target/release/kg_sim
          python tools/ci_run.py python -m unittest discover -s tests -v
      - name: Differential tests against the pinned Python engine
        run: python tools/ci_run.py python tools/check.py --check --seeds 64 --threads 4
      - name: Benchmark (informational, not a noisy timing gate)
        run: python tools/ci_run.py python tools/benchmark.py --games 64 --threads 4 --repeats 3
      - name: Enforce checks and tracked formatting
        env:
          CLIPPY_RESULT: ${{ steps.clippy.outcome }}
          RUST_TEST_RESULT: ${{ steps.rust_tests.outcome }}
        run: |
          test "$CLIPPY_RESULT" = success
          test "$RUST_TEST_RESULT" = success
          git diff --exit-code -- '*.rs'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kg-sim-${{ github.sha }}
          path: |
            kaggriculture_meta_lab/rust_port/target/release/kg_sim
            kaggriculture_meta_lab/rust_port/work/check-report.json
            kaggriculture_meta_lab/rust_port/work/benchmark.json
          retention-days: 7
