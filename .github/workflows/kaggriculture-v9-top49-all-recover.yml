name: Kaggriculture retain all-five result
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-v9-top49-all-recover.yml"]
permissions:
  actions: read
  contents: write
jobs:
  retain:
    if: contains(github.event.head_commit.message, '[kaggr-all5-retain]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results
          merge-multiple: true
          run-id: 34079558032
          github-token: ${{ github.token }}
      - run: |
          python - <<'PY'
          import collections,glob,json,os
          groups=collections.defaultdict(list); output=[]
          for path in glob.glob('results/**/*.json',recursive=True):
              agent=os.path.basename(path).rsplit('_',1)[0]
              groups[agent].append(json.load(open(path)))
          for agent, rows in sorted(groups.items()):
              episodes=sum(x['episodes'] for x in rows); games=sum(x['games'] for x in rows)
              avg=lambda key: sum(x[key]*x['episodes'] for x in rows)/episodes
              output.append({'agent':agent,'shards':len(rows),'episodes':episodes,'games':games,'wins':sum(x['wins'] for x in rows),'our_mean':avg('our_mean'),'opponent_mean':avg('opponent_mean'),'margin_mean':avg('margin_mean')})
          os.makedirs('kaggriculture/research',exist_ok=True)
          open('kaggriculture/research/TOP49_ALL5_RESULTS.json','w').write(json.dumps(output,indent=2)+'\n')
          PY
          cat kaggriculture/research/TOP49_ALL5_RESULTS.json
          content=$(base64 -w0 kaggriculture/research/TOP49_ALL5_RESULTS.json)
          jq -n --arg message "research(kaggriculture): record all-five TOP49 validation [skip ci]" --arg content "$content" --arg branch "$GITHUB_REF_NAME" '{message:$message,content:$content,branch:$branch}' > /tmp/body.json
          curl --fail-with-body -X PUT -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/kaggriculture/research/TOP49_ALL5_RESULTS.json" --data-binary @/tmp/body.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
