name: Kaggriculture G4 bounded closed-loop holdout
on:
  push:
    branches: ["arena/01a0712c-riemann"]
    paths: [".github/workflows/kaggriculture-g4-closed-loop.yml"]
permissions:
  contents: write
jobs:
  holdout:
    if: contains(github.event.head_commit.message, '[kg-g4-holdout]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Install pinned competition framework
        run: pip install --disable-pip-version-check kaggle-environments==1.32.7
      - name: Validate standalone agent and run both-seat holdout
        env:
          PYTHONPATH: kaggriculture_meta_lab
        run: |
          python -m py_compile kaggriculture_meta_lab/agents/variants/agent_v11_subin_g4_29.py
          rc=0
          python kaggriculture_meta_lab/scripts/validate_current.py \
            --candidate agents/variants/agent_v11_subin_g4_29.py \
            --control agents/current/agent_v9_b21_s16.py \
            --games 16 --workers 4 --start-seed 20260940 || rc=$?
          result=$(ls -t kaggriculture_meta_lab/results/validate-current-*.json | head -1)
          cp "$result" kaggriculture_meta_lab/results/g4-29-vs-b21-16seed-20260909.json
          python - <<'PY'
          import json
          p='kaggriculture_meta_lab/results/g4-29-vs-b21-16seed-20260909.json'
          d=json.load(open(p)); assert d['controls'][0]['errors']==0, d
          PY
          exit "$rc"
      - name: Persist holdout even when promotion gate rejects
        if: always()
        run: |
          test -f kaggriculture_meta_lab/results/g4-29-vs-b21-16seed-20260909.json || exit 1
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kaggriculture_meta_lab/results/g4-29-vs-b21-16seed-20260909.json
          git commit -m "Record G4-29 closed-loop holdout"
          git push origin HEAD:arena/01a0712c-riemann
