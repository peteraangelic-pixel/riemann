[pytest]
# Scope collection to THIS folder's tests only. Without this, running pytest
# from inside a directory that also contains a nested copy of the lab (e.g. a
# "LAB centralny" subfolder the user downloaded alongside) makes pytest import
# two test files with the same basename and abort with an "import file
# mismatch" collection error.
testpaths = tests
addopts = --import-mode=importlib
norecursedirs = .git .venv build dist reports artifacts agents/sweeps agents/openings
