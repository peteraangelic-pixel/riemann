[package]
name = "kg-sim"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Deterministic Kaggriculture 1.32.7 tape simulator with Rayon batch execution"
publish = false

[lib]
name = "kg_sim"
path = "src/lib.rs"

[[bin]]
name = "kg_sim"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
